<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#f0ead8"/>
  
  <!-- Anchor -->
  <g transform="translate(16, 14)" stroke="#a07840" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Ring at top -->
    <circle cx="0" cy="-7" r="2.8" stroke-width="1.6"/>
    <!-- Vertical shaft -->
    <line x1="0" y1="-4.2" x2="0" y2="8" stroke-width="1.6"/>
    <!-- Crossbar -->
    <line x1="-5.5" y1="-0.5" x2="5.5" y2="-0.5" stroke-width="1.6"/>
    <!-- Flukes -->
    <path d="M-4.5 8 Q-7 5.5,-5 3 Q-2.5 1,0 2 Q2.5 1,5 3 Q7 5.5,4.5 8" stroke-width="1.6"/>
  </g>
  
  <!-- Wave decoration at bottom of anchor -->
  <path d="M7 25 C9.5 22.5,11.5 27,14 25 C16.5 22.5,18.5 27,21 25 C22.5 23.5,23.5 24,25 25"
    stroke="#c8a97e" stroke-width="1.2" fill="none" stroke-linecap="round"/>
