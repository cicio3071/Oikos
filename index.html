<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oikos</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" sizes="64x64" />
  <meta property="og:title" content="Oikos" />
  <meta property="og:description" content="You are my Oikos" />
  <meta property="og:image" content="https://cicio3071.github.io/Oikos/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cicio3071.github.io/Oikos/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://cicio3071.github.io/Oikos/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Noto+Sans+TC:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Themes (unchanged from original tuning) ── */
    :root {
      --bg:       #f5f0e8;
      --surface:  #ede8de;
      --panel:    #e6dfd3;
      --border:   #d4ccbc;
      --border2:  #c4baa8;
      --accent:   #a07840;
      --accent2:  #c8a97e;
      --text-pri: #2c2418;
      --text-sec: #6b5c44;
      --text-dim: #a89880;
      --en-font:  'DM Sans', sans-serif;
      --zh-font:  'Noto Sans TC', sans-serif;
      --el-font:  'EB Garamond', serif;
    }

    [data-theme="seafoam"] {
      --bg:       #eef6f4;
      --surface:  #e4f0ec;
      --panel:    #d7e9e3;
      --border:   #c2ddd3;
      --border2:  #a7ccbf;
      --accent:   #3d8a76;
      --accent2:  #6bb0a0;
      --text-pri: #16342c;
      --text-sec: #3a6b5c;
      --text-dim: #7fa89a;
    }

    [data-theme="coral"] {
      --bg:       #fdf1eb;
      --surface:  #fce7dd;
      --panel:    #f8d9c9;
      --border:   #f0c3ad;
      --border2:  #e6a988;
      --accent:   #d96a3e;
      --accent2:  #eda078;
      --text-pri: #3a2015;
      --text-sec: #7a4530;
      --text-dim: #b98a6d;
    }

    [data-theme="mist"] {
      --bg:       #eef2f6;
      --surface:  #e4eaf0;
      --panel:    #d8e2ec;
      --border:   #c4d0de;
      --border2:  #aabcce;
      --accent:   #4a7a9a;
      --accent2:  #78a8c0;
      --text-pri: #1a2e3e;
      --text-sec: #3a607a;
      --text-dim: #7a9aae;
    }

    [data-theme="lavender"] {
      --bg:       #f4f0f8;
      --surface:  #ece5f3;
      --panel:    #e0d5ed;
      --border:   #cebfe1;
      --border2:  #b6a1d1;
      --accent:   #7a5ea8;
      --accent2:  #9a80c0;
      --text-pri: #2c2040;
      --text-sec: #5a4878;
      --text-dim: #9689ac;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-pri);
      font-family: var(--en-font);
      overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ── Paper grain (SVG turbulence, no image asset needed) ── */
    .grain {
      position: absolute; inset: 0; pointer-events: none;
      opacity: 0.05; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    /* all themes are light now, so the grain uses the same soft multiply blend everywhere */

    #app { position: relative; width: 100%; height: 100%; overflow: hidden; }

    /* ── Bookmark tab (目錄 entry point) ── */
    #toc-tab {
      position: fixed; top: 0; left: 0; z-index: 40;
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px 12px 14px;
      background: var(--accent); color: var(--bg);
      border: none; border-radius: 0 10px 10px 0;
      font-family: var(--el-font); font-size: 14px; letter-spacing: 0.08em;
      cursor: pointer; box-shadow: 3px 3px 12px rgba(0,0,0,0.18);
      transition: padding 0.2s ease, transform 0.2s ease, background 0.2s ease;
      margin-top: 28px;
    }
    #toc-tab:hover { padding-right: 22px; transform: translateX(2px); }
    #toc-tab-icon { font-size: 15px; line-height: 1; }

    /* Desktop: the whole left gutter becomes a book spine, always visible & clickable */
    @media (min-width: 1024px) {
      #toc-tab {
        top: 0; margin-top: 0;
        width: 88px; height: 100vh;
        border-radius: 0; border-right: 1px solid var(--border);
        flex-direction: column; justify-content: center; gap: 14px;
        padding: 0; background: var(--surface); color: var(--text-sec);
        box-shadow: 2px 0 14px rgba(0,0,0,0.05);
        position: fixed; overflow: hidden;
      }
      #toc-tab::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        opacity: 0.05; mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      }
      #toc-tab:hover { padding: 0; transform: none; background: var(--panel); color: var(--accent); }
      #toc-tab-icon { font-size: 18px; position: relative; z-index: 1; }
      #toc-tab span:last-child {
        writing-mode: vertical-rl; letter-spacing: 0.3em; font-size: 13px;
        position: relative; z-index: 1;
      }
      #page-wrap { left: 88px !important; }
      #player-bar { left: 88px !important; }
      .page { max-width: 800px !important; }
    }


    /* ── TOC drawer/overlay ── */
    #toc-overlay {
      position: fixed; inset: 0; z-index: 50;
      pointer-events: none; opacity: 0;
      transition: opacity 0.28s ease;
    }
    #toc-overlay.open { pointer-events: auto; opacity: 1; }
    #toc-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.32);
    }
    #toc-panel {
      position: absolute; top: 0; left: 0; height: 100%;
      width: 340px; max-width: 86vw;
      background: var(--surface);
      border-right: 1px solid var(--border);
      box-shadow: 8px 0 32px rgba(0,0,0,0.2);
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.32s cubic-bezier(0.22,0.61,0.36,1);
    }
    #toc-overlay.open #toc-panel { transform: translateX(0); }

    #toc-panel-header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 26px 24px 14px;
      border-bottom: 1px solid var(--border);
    }
    #toc-panel-title {
      font-family: var(--el-font); font-style: italic; font-size: 22px;
      color: var(--text-pri); letter-spacing: 0.04em;
    }
    #toc-panel-sub, .panel-sub { font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
    #toc-close {
      background: none; border: none; color: var(--text-dim);
      font-size: 18px; cursor: pointer; padding: 4px 8px;
    }
    #toc-close:hover { color: var(--text-pri); }

    #toc-list { flex: 1; overflow-y: auto; padding: 8px 0 16px; }
    #toc-list::-webkit-scrollbar { width: 5px; }
    #toc-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    .toc-item {
      display: flex; align-items: baseline; gap: 12px;
      padding: 10px 24px;
      cursor: pointer;
      border-bottom: 1px dotted var(--border);
      transition: background 0.15s;
    }
    .toc-item:hover { background: var(--panel); }
    .toc-item.active { background: var(--panel); }
    .toc-item.active .toc-num, .toc-item.active .toc-name { color: var(--accent); }
    .toc-num {
      font-family: var(--el-font); font-style: italic; font-size: 13px;
      color: var(--text-dim); width: 22px; flex-shrink: 0;
    }
    .toc-name {
      font-family: var(--zh-font); font-size: 13.5px; color: var(--text-sec);
      line-height: 1.5;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .toc-dot {
      margin-left: auto; width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); opacity: 0; flex-shrink: 0;
    }
    .toc-item.playing .toc-dot { opacity: 1; }

    #toc-theme-bar {
      display: flex; align-items: center; gap: 9px;
      padding: 14px 24px; border-top: 1px solid var(--border);
    }
    .theme-dot {
      width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: transform 0.15s;
    }
    .theme-dot:hover { transform: scale(1.15); }
    .theme-dot.active { border-color: var(--text-pri); }
    .theme-dot[data-t="parchment"] { background: #a07840; }
    .theme-dot[data-t="seafoam"]   { background: #3d8a76; }
    .theme-dot[data-t="coral"]     { background: #d96a3e; }
    .theme-dot[data-t="mist"]      { background: #4a7a9a; }
    .theme-dot[data-t="lavender"]  { background: #7a5ea8; }

    /* ── The book ── */
    #book { position: relative; width: 100%; height: 100%; }
    #page-wrap {
      position: absolute; inset: 0; bottom: 92px;
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .page {
      position: relative;
      min-height: 100%;
      max-width: 760px; margin: 0 auto;
      padding: 100px 48px 64px;
      opacity: 1;
      transition: opacity 0.22s ease;
    }
    .page.fading { opacity: 0; }

    /* Cover / welcome page */
    #cover-page {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; min-height: 100%; gap: 22px;
    }
    #cover-wave { width: 240px; height: auto; opacity: 0.7; }
    #cover-title {
      font-family: var(--el-font); font-style: italic; font-size: 28px;
      color: var(--text-pri); letter-spacing: 0.03em;
    }
    #cover-sub { font-family: var(--zh-font); font-size: 13px; color: var(--text-dim); }
    #cover-open-btn {
      margin-top: 6px; padding: 11px 28px;
      background: var(--accent); color: var(--bg); border: none; border-radius: 24px;
      font-family: var(--el-font); font-style: italic; font-size: 14px; letter-spacing: 0.06em;
      cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      transition: transform 0.15s;
    }
    #cover-open-btn:hover { transform: scale(1.04); }

    /* Song page */
    #song-page { display: none; }
    #page-tint {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      opacity: 0; transition: opacity 0.5s ease, background 0.5s ease;
    }
    .page > * { position: relative; z-index: 1; }

    #page-number {
      position: absolute; top: 18px; right: 8px;
      font-family: var(--el-font); font-style: italic; font-size: 11px;
      color: var(--text-dim); letter-spacing: 0.1em;
      opacity: 0.75;
    }

    #page-photo-wrap {
      display: flex; margin-bottom: 30px; margin-top: 8px;
      position: relative; cursor: pointer;
    }
    /* washi tape: a small translucent strip pinning the photo corner, like it was hand-pasted in */
    #page-photo-wrap::before {
      content: ''; position: absolute; z-index: 2;
      width: 64px; height: 26px;
      background: var(--accent2);
      opacity: 0.55;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .layout-a #page-photo-wrap::before {
      top: -12px; left: 24px; transform: rotate(-7deg);
    }
    .layout-b #page-photo-wrap::before {
      top: -12px; right: 24px; transform: rotate(6deg);
    }
    .layout-c #page-photo-wrap::before {
      top: -12px; left: 50%; transform: translateX(-70%) rotate(-4deg);
    }
    #page-photo {
      width: 280px; max-width: 62%; height: auto;
      display: block;
      -webkit-mask-image: radial-gradient(ellipse farthest-corner at center, black 82%, transparent 100%);
      mask-image: radial-gradient(ellipse farthest-corner at center, black 82%, transparent 100%);
      filter: saturate(0.94) brightness(1.01);
      box-shadow: 0 12px 34px rgba(0,0,0,0.16);
      transition: opacity 0.4s ease;
      opacity: 0;
    }
    #page-photo.loaded { opacity: 1; }

    /* ── Vinyl mode: click the photo to flip it into a spinning record ── */
    #song-page.vinyl-on #page-photo-wrap {
      justify-content: center !important;
      margin: 24px auto 76px !important;
      transition: margin 0.4s ease;
    }
    #song-page:not(.vinyl-on) #page-photo-wrap { transition: margin 0.4s ease; }

    /* Non-vinyl mode: the inner disc wrapper should be fully transparent to layout */
    #vinyl-disc { display: contents; }

    /* Decorative companion photos: hidden by default (mobile/tablet/narrow
       desktop) — only shown in the wide two-page desktop layout, purely
       decorative, never clickable, and always fade away in vinyl mode. */
    .decor-photo { display: none; }
    #song-page.vinyl-on .decor-photo { opacity: 0 !important; }

    #song-page.vinyl-on #page-photo {
      width: 230px; max-width: 66vw; height: 230px;
      object-fit: cover;
      -webkit-mask-image: none; mask-image: none;
      border-radius: 50%;
      transform: none !important;
      box-shadow: 0 4px 0 4px var(--surface), 0 18px 40px rgba(0,0,0,0.3);
      position: relative; z-index: 2;
    }

    /* In vinyl mode #vinyl-disc becomes a real, rotatable box (photo + grooves spin together).
       Rotation angle is driven by JS (requestAnimationFrame) rather than a CSS animation,
       so it can accelerate/decelerate smoothly like a real turntable motor with inertia. */
    #song-page.vinyl-on #vinyl-disc {
      display: block; position: relative;
      width: 230px; max-width: 66vw; height: 230px;
      will-change: transform;
    }
    #song-page.vinyl-on #vinyl-disc::after {
      content: '';
      position: absolute; z-index: 1;
      width: 320px; height: 320px; max-width: 92vw; max-height: 92vw;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at center, transparent 0 36px, rgba(0,0,0,0) 36px),
        repeating-radial-gradient(circle at center, #232323 0px, #232323 2px, #2c2c2c 2px, #2c2c2c 5px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.32);
    }

    /* tonearm: reuses the same pseudo-element normally used as washi tape, stays on the
       outer (non-rotating) wrap so it doesn't spin along with the disc */
    #song-page.vinyl-on #page-photo-wrap::before {
      width: 5px; height: 84px; border-radius: 3px;
      background: var(--text-pri); opacity: 0.8;
      top: -14px; left: auto; right: 10%;
      transform: rotate(48deg); transform-origin: top right;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.5s cubic-bezier(.34,1.56,.64,1);
      z-index: 3;
    }
    #song-page.vinyl-on.spinning #page-photo-wrap::before { transform: rotate(36deg); }


    /* three layout variants, cycled by track index for visual rhythm */
    .layout-a #page-photo-wrap { justify-content: flex-start; }
    .layout-a #page-photo { transform: rotate(-2.2deg); }

    .layout-b #page-photo-wrap { justify-content: flex-end; }
    .layout-b #page-photo { transform: rotate(1.8deg); }

    .layout-c #page-photo-wrap { justify-content: center; }
    .layout-c #page-photo { width: 320px; transform: rotate(-0.8deg); }

    #page-title {
      font-family: var(--el-font); font-style: italic; font-weight: 500;
      font-size: 27px; line-height: 1.35;
      color: var(--text-pri); margin-bottom: 6px;
      max-width: 90%;
    }
    #page-title-sub {
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 34px;
    }

    #page-lyrics { display: flex; flex-direction: column; }
    .lyric-en, .lyric-zh {
      display: block; opacity: 0; transform: translateY(4px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .lyric-en.visible, .lyric-zh.visible { opacity: 1; transform: translateY(0); }
    .lyric-en {
      font-family: var(--en-font); font-size: 15.5px; font-weight: 400;
      color: var(--text-pri); line-height: 1.7; margin-top: 2px;
    }
    .lyric-zh {
      font-family: var(--zh-font); font-size: 12.5px; font-weight: 300;
      color: var(--text-dim); line-height: 1.6; margin-bottom: 4px;
    }
    .lyric-blank {
      display: block; height: 24px; opacity: 0;
      transition: opacity 0.6s ease;
    }

    #page-share {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 30px; padding: 8px 16px;
      background: none; border: 1px solid var(--border2); border-radius: 20px;
      color: var(--text-sec); font-family: var(--en-font); font-size: 12px;
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    #page-share:hover { border-color: var(--accent); color: var(--accent); }

    #page-footer {
      margin-top: 40px; padding-top: 18px; border-top: 1px dotted var(--border);
      font-size: 10.5px; color: var(--text-dim); font-family: var(--en-font);
    }

    #share-toast {
      position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--text-pri); color: var(--bg);
      padding: 8px 18px; border-radius: 20px; font-size: 12px;
      opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
      z-index: 60;
    }
    #share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Player bar (bound at the bottom like a spine/ribbon) ── */
    #player-bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 92px;
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; flex-direction: column; justify-content: center;
      padding: 10px 28px 16px; gap: 8px;
      z-index: 2;
    }
    #progress-wrap { display: flex; align-items: center; gap: 10px; }
    .time-label { font-family: var(--en-font); font-size: 10.5px; color: var(--text-dim); width: 32px; }
    #progress-track {
      flex: 1; height: 3px; background: var(--border); border-radius: 3px;
      position: relative; cursor: pointer;
    }
    #progress-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--accent); border-radius: 3px; }
    #progress-thumb {
      position: absolute; top: 50%; left: 0%; width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); transform: translate(-50%,-50%);
      box-shadow: 0 0 0 3px var(--surface);
    }
    #controls { display: flex; align-items: center; gap: 18px; }
    #volume-wrap { display: flex; align-items: center; gap: 6px; }
    #volume-icon { font-size: 13px; color: var(--text-dim); }
    #volume-slider { width: 70px; accent-color: var(--accent); }
    .ctrl-btn {
      background: none; border: none; color: var(--text-sec);
      font-size: 15px; cursor: pointer; padding: 6px;
      transition: color 0.15s;
    }
    .ctrl-btn:hover { color: var(--accent); }
    #btn-play {
      font-size: 15px; color: var(--bg);
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
    }
    #btn-play:hover { background: var(--accent2); }
    #mode-wrap { display: flex; gap: 4px; margin-left: auto; }
    .mode-btn {
      background: none; border: none; color: var(--text-dim);
      font-size: 14px; cursor: pointer; padding: 5px 7px; border-radius: 6px;
    }
    .mode-btn.active { color: var(--accent); background: var(--panel); }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      #toc-panel { width: 88vw; }
      .page { padding: 88px 24px 48px; }
      #page-photo { max-width: 76%; }
      .layout-c #page-photo { width: 76%; }
      #page-title { font-size: 23px; }
      #player-bar { padding: 8px 16px 14px; height: 84px; }
      #volume-wrap { display: none; }
    }

    @media (min-width: 721px) and (max-width: 1080px) {
      #toc-backdrop { backdrop-filter: blur(1px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .page, .lyric-en, .lyric-zh, #page-photo, #toc-panel, #toc-overlay { transition: none !important; }
    }

    /* Keyboard focus visibility */
    button:focus-visible, .toc-item:focus-visible, .theme-dot:focus-visible, #page-photo-wrap:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* ── Wide desktop only: an open book — photo/vinyl on the left leaf, text on the
       right leaf. Gated on (hover:hover) and (pointer:fine) in addition to width so
       a touch device (iPad, even in wide landscape) never gets this — only an actual
       mouse-driven desktop does. Phones and tablets are completely untouched. ── */
    @media (min-width: 1280px) and (hover: hover) and (pointer: fine) {
      /* The desk: a tone visibly deeper than the page itself, so the book
         reads as an object sitting on a surface rather than a flat fill. */
      #book { background: var(--panel); }

      /* The book: page-wrap becomes a bounded, rounded, shadowed object
         inset from the desk edges, instead of filling the whole viewport. */
      #page-wrap {
        top: 22px !important; right: 30px !important;
        bottom: 114px !important; left: 100px !important;
        background: var(--bg);
        border-radius: 14px;
        box-shadow: 0 28px 64px rgba(0,0,0,0.20), 0 6px 18px rgba(0,0,0,0.10);
      }
      /* Control strip: a separate tray resting below the book, sharing its margins */
      #player-bar {
        left: 100px !important; right: 30px !important; bottom: 22px !important;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      }
      /* The book spine tab lines up with the book's new left edge rather than
         the bare viewport edge */
      #toc-tab { box-shadow: 4px 0 20px rgba(0,0,0,0.1); }

      #song-page {
        display: grid !important;
        grid-template-columns: minmax(230px, 320px) 96px minmax(0, 1fr);
        column-gap: 0; row-gap: 6px;
        max-width: 1080px !important;
        padding-top: 96px;
      }
      /* Gutter shadow: a soft wide band where the two pages curve down into
         the spine, rather than a single hairline */
      #song-page::before {
        content: '';
        grid-column: 2; grid-row: 1 / -1;
        width: 100%; margin: 40px 0 24px;
        background: linear-gradient(to right,
          transparent 0%,
          rgba(0,0,0,0.05) 38%,
          rgba(0,0,0,0.09) 50%,
          rgba(0,0,0,0.05) 62%,
          transparent 100%);
      }
      /* The crease itself: a fine defined line at the exact center of the gutter */
      #song-page::after {
        content: '';
        grid-column: 2; grid-row: 1 / -1;
        width: 1px; margin: 40px auto 24px;
        background: var(--border2); opacity: 0.7;
      }
      #page-photo-wrap {
        grid-column: 1; grid-row: 1 / span 5;
        align-self: start; justify-self: center;
        justify-content: center !important; margin: 6px 0 0 !important;
      }
      .decor-photo {
        display: block; position: absolute; z-index: 0;
        pointer-events: none; user-select: none;
        object-fit: cover; border-radius: 5px;
        opacity: 0; transition: opacity 0.6s ease, box-shadow 0.3s ease;
        filter: saturate(0.45) brightness(1.04);
        box-shadow: 0 10px 22px rgba(0,0,0,0.14);
      }
      .decor-photo.loaded { opacity: 0.5; }
      .decor-1 { width: 118px; height: 82px; top: -38px; left: -66px; transform: rotate(-10deg); }
      .decor-2 { width: 108px; height: 76px; bottom: -34px; right: -60px; transform: rotate(8deg); }
      .decor-3 { width: 92px; height: 64px; bottom: 30px; left: -86px; transform: rotate(5deg); }
      #page-title      { grid-column: 3; grid-row: 1; }
      #page-title-sub  { grid-column: 3; grid-row: 2; }
      #page-lyrics     { grid-column: 3; grid-row: 3; }
      #page-share      { grid-column: 3; grid-row: 4; }
      #page-footer     { grid-column: 3; grid-row: 5; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- 目錄 bookmark tab -->
  <button id="toc-tab" aria-label="打開目錄">
    <span id="toc-tab-icon">🔖</span><span>目錄</span>
  </button>

  <!-- TOC drawer -->
  <div id="toc-overlay">
    <div id="toc-backdrop"></div>
    <div id="toc-panel">
      <div id="toc-panel-header">
        <div>
          <div id="toc-panel-title">目錄</div>
          <div id="toc-count" class="panel-sub">載入中…</div>
        </div>
        <button id="toc-close" aria-label="關閉目錄">✕</button>
      </div>
      <div id="toc-list"></div>
      <div id="toc-theme-bar">
        <div class="theme-dot active" data-t="parchment" title="Parchment" tabindex="0" role="button" aria-label="暖米色主題"></div>
        <div class="theme-dot" data-t="seafoam" title="Seafoam" tabindex="0" role="button" aria-label="海沫綠主題"></div>
        <div class="theme-dot" data-t="coral" title="Coral" tabindex="0" role="button" aria-label="珊瑚橘主題"></div>
        <div class="theme-dot" data-t="mist" title="Mist" tabindex="0" role="button" aria-label="淺灰藍主題"></div>
        <div class="theme-dot" data-t="lavender" title="Lavender" tabindex="0" role="button" aria-label="薰衣草紫主題"></div>
      </div>
    </div>
  </div>

  <!-- The book -->
  <main id="book">
    <div class="grain"></div>
    <div id="page-wrap">

      <!-- Cover / welcome page -->
      <section id="cover-page" class="page">
        <svg id="cover-wave" viewBox="0 0 320 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 30 C20 10,40 50,60 30 C80 10,100 50,120 30 C140 10,160 50,180 30 C200 10,220 50,240 30 C260 10,280 50,300 30 C310 20,315 25,320 30"
            stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" fill="none">
            <animate attributeName="d"
              values="M0 30 C20 10,40 50,60 30 C80 10,100 50,120 30 C140 10,160 50,180 30 C200 10,220 50,240 30 C260 10,280 50,300 30 C310 20,315 25,320 30;M0 30 C20 50,40 10,60 30 C80 50,100 10,120 30 C140 50,160 10,180 30 C200 50,220 10,240 30 C260 50,280 10,300 30 C310 40,315 35,320 30;M0 30 C20 10,40 50,60 30 C80 10,100 50,120 30 C140 10,160 50,180 30 C200 10,220 50,240 30 C260 10,280 50,300 30 C310 20,315 25,320 30"
              dur="4s" repeatCount="indefinite" />
          </path>
        </svg>
        <div id="cover-title">Ἐν τῇ ψυχῇ μου ἔχεις</div>
        <div id="cover-count" class="panel-sub">載入中…</div>
        <button id="cover-open-btn">打開目錄，選一首歌</button>
      </section>

      <!-- Song page -->
      <section id="song-page" class="page">
        <div id="page-tint"></div>
        <div id="page-number"></div>
        <div id="page-photo-wrap" tabindex="0" role="button" aria-label="切換黑膠唱片模式">
          <img class="decor-photo decor-1" alt="" aria-hidden="true">
          <img class="decor-photo decor-2" alt="" aria-hidden="true">
          <img class="decor-photo decor-3" alt="" aria-hidden="true">
          <div id="vinyl-disc"><img id="page-photo" alt="" /></div>
        </div>
        <h2 id="page-title">—</h2>
        <div id="page-title-sub"></div>
        <div id="page-lyrics"></div>
        <button id="page-share">⬡ 分享這首歌</button>
        <div id="page-footer">Music generated with Suno · Cover art generated with Gemini / ChatGPT</div>
      </section>

    </div>

    <span id="share-toast">已複製連結！</span>

    <!-- Player bar -->
    <div id="player-bar">
      <div id="progress-wrap">
        <span class="time-label" id="time-current">0:00</span>
        <div id="progress-track">
          <div id="progress-fill"></div>
          <div id="progress-thumb"></div>
        </div>
        <span class="time-label" id="time-total" style="text-align:right">0:00</span>
      </div>
      <div id="controls">
        <div id="volume-wrap">
          <span id="volume-icon">♪</span>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" />
        </div>
        <button class="ctrl-btn" id="btn-prev" title="上一首">&#9664;&#9664;</button>
        <button class="ctrl-btn" id="btn-play" title="播放/暫停">&#9654;</button>
        <button class="ctrl-btn" id="btn-next" title="下一首">&#9654;&#9654;</button>
        <div id="mode-wrap">
          <button class="mode-btn" id="btn-shuffle" title="隨機播放">⇄</button>
          <button class="mode-btn active" id="btn-loop-all" title="全部循環">↻</button>
          <button class="mode-btn" id="btn-loop-one" title="單曲循環">⟳</button>
        </div>
      </div>
    </div>
  </main>
</div>

<audio id="audio-player" preload="none"></audio>

<script>
  const audio = document.getElementById('audio-player');
  let songs = [], currentIndex = -1, isPlaying = false, playMode = 'all';

  // ── Theme ──
  const themes = ['parchment','seafoam','coral','mist','lavender'];
  let currentTheme = 'parchment';
  try { currentTheme = localStorage.getItem('mb-theme') || 'parchment'; } catch (e) { /* storage blocked, fall back to default theme */ }

  function applyTheme(t) {
    currentTheme = t;
    document.documentElement.setAttribute('data-theme', t === 'parchment' ? '' : t);
    try { localStorage.setItem('mb-theme', t); } catch (e) { /* storage unavailable, theme just won't persist */ }
    document.querySelectorAll('.theme-dot').forEach(d => {
      d.classList.toggle('active', d.dataset.t === t);
    });
  }
  document.querySelectorAll('.theme-dot').forEach(d => {
    d.addEventListener('click', () => applyTheme(d.dataset.t));
    d.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); applyTheme(d.dataset.t); }
    });
  });
  applyTheme(currentTheme);

  // ── TOC drawer ──
  const tocOverlay = document.getElementById('toc-overlay');
  function openToc() { tocOverlay.classList.add('open'); }
  function closeToc() { tocOverlay.classList.remove('open'); }
  document.getElementById('toc-tab').addEventListener('click', openToc);
  document.getElementById('toc-close').addEventListener('click', closeToc);
  document.getElementById('toc-backdrop').addEventListener('click', closeToc);
  document.getElementById('cover-open-btn').addEventListener('click', openToc);

  // ── Init ──
  async function init() {
    try {
      const res = await fetch('songs.json');
      songs = await res.json();
      renderToc();
      const countText = songs.length + ' 首歌';
      document.getElementById('toc-count').textContent = countText;
      document.getElementById('cover-count').textContent = countText;

      const params = new URLSearchParams(window.location.search);
      const trackParam = params.get('track');
      if (trackParam) {
        const idx = songs.findIndex(s => s.id === trackParam.padStart(2,'0'));
        if (idx >= 0) { selectTrack(idx, { autoplay: false }); return; }
      }
      const lastTrack = localStorage.getItem('mb-last-track');
      if (lastTrack) {
        const idx = songs.findIndex(s => s.id === lastTrack);
        if (idx >= 0) selectTrack(idx, { autoplay: false });
      }
    } catch {
      document.getElementById('toc-count').textContent = '無法載入曲目';
      document.getElementById('cover-count').textContent = '無法載入曲目';
    }
  }

  function renderToc() {
    const list = document.getElementById('toc-list');
    list.innerHTML = '';
    songs.forEach((song, i) => {
      const item = document.createElement('div');
      item.className = 'toc-item';
      item.tabIndex = 0;
      item.dataset.index = i;
      item.innerHTML = `
        <span class="toc-num">${song.id}</span>
        <span class="toc-name">${escHtml(song.title)}</span>
        <span class="toc-dot"></span>
      `;
      item.addEventListener('click', () => { selectTrack(i); closeToc(); });
      item.addEventListener('keydown', e => {
        if (e.key === 'Enter') { selectTrack(i); closeToc(); }
      });
      list.appendChild(item);
    });
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Dominant color extraction for the per-page tint wash ──
  function applyPageTint(img) {
    const tint = document.getElementById('page-tint');
    try {
      const w = 20, h = 20;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const data = ctx.getImageData(0, 0, w, h).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < data.length; i += 4) {
        r += data[i]; g += data[i+1]; b += data[i+2]; n++;
      }
      r = Math.round(r/n); g = Math.round(g/n); b = Math.round(b/n);
      tint.style.background = `radial-gradient(ellipse at 30% 20%, rgba(${r},${g},${b},0.13), transparent 65%)`;
      tint.style.opacity = '1';
    } catch (e) {
      // canvas read blocked (e.g. file:// protocol) — fail silently, page just has no tint
      tint.style.opacity = '0';
    }
  }

  const LAYOUTS = ['layout-a', 'layout-b', 'layout-c'];

  // Deterministically picks a few *other* songs to show as small decorative
  // companions next to the current one — same song always gets the same
  // companions (not re-randomized on every reload), purely for visual fill
  // on the wide desktop spread. Never clickable, never becomes the vinyl.
  function setDecorPhotos(index) {
    const els = document.querySelectorAll('.decor-photo');
    const n = songs.length;
    const offsets = [7, 13, 19, 5, 11, 3];
    const picks = [];
    if (n > 1) {
      for (const off of offsets) {
        if (picks.length >= els.length) break;
        const idx = (index + off) % n;
        if (idx !== index && !picks.includes(idx)) picks.push(idx);
      }
    }
    els.forEach((el, i) => {
      el.classList.remove('loaded');
      const companion = picks[i] !== undefined ? songs[picks[i]] : null;
      if (companion) {
        el.onload = () => el.classList.add('loaded');
        el.onerror = () => { el.style.visibility = 'hidden'; };
        el.style.visibility = '';
        el.src = 'images/' + companion.id + '.png';
      } else {
        el.style.visibility = 'hidden';
      }
    });
  }

  async function selectTrack(index, opts = {}) {
    const autoplay = opts.autoplay !== false;
    currentIndex = index;
    const song = songs[index];

    document.getElementById('cover-page').style.display = 'none';
    const songPage = document.getElementById('song-page');

    const doUpdate = () => {
      songPage.className = 'page ' + LAYOUTS[index % LAYOUTS.length];
      songPage.style.display = 'block';

      document.getElementById('page-number').textContent = '— ' + song.id + ' / ' + String(songs.length).padStart(2,'0') + ' —';
      document.getElementById('page-title').textContent = song.title;

      const img = document.getElementById('page-photo');
      img.classList.remove('loaded');
      img.onload = () => { img.classList.add('loaded'); applyPageTint(img); };
      img.onerror = () => { img.style.display = 'none'; };
      img.style.display = '';
      img.src = 'images/' + song.id + '.png';

      setDecorPhotos(index);

      document.getElementById('page-lyrics').innerHTML =
        '<span style="color:var(--text-dim);font-family:var(--zh-font);font-size:13px">載入中…</span>';
      loadLyrics(song.id);

      document.querySelectorAll('.toc-item').forEach((el, i) => el.classList.toggle('active', i === index));
      document.getElementById('page-wrap').scrollTop = 0;

      requestAnimationFrame(() => songPage.classList.remove('fading'));
    };

    if (songPage.style.display === 'block') {
      songPage.classList.add('fading');
      setTimeout(doUpdate, 190);
    } else {
      doUpdate();
    }

    try { localStorage.setItem('mb-last-track', song.id); } catch (e) { /* storage unavailable, last-track just won't persist */ }
    const url = new URL(window.location.href);
    url.searchParams.set('track', song.id);
    window.history.replaceState({}, '', url);

    audio.src = 'audio/' + song.id + '.mp3';
    audio.load();
    if (autoplay) audio.play().catch(() => {});
  }

  async function loadLyrics(id) {
    const container = document.getElementById('page-lyrics');
    try {
      const res = await fetch('lyrics/' + id + '.txt');
      if (!res.ok) throw new Error();
      renderLyrics(await res.text(), container);
    } catch {
      container.innerHTML = '<span style="color:var(--text-dim);font-family:var(--zh-font);font-size:13px">歌詞未載入</span>';
    }
  }

  function renderLyrics(text, container) {
    const isEn = s => /^[\x00-\x7F\u00C0-\u024F\u0370-\u03FF\u1F00-\u1FFF\u2018\u2019\u201C\u201D\u2014\u2013\s]+$/.test(s.trim());
    const lines = text.split('\n');
    let start = 0;
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      if (i === 0 && !lines[i].match(/[,.'!?，。！？]/)) start = i + 1;
      break;
    }
    container.innerHTML = '';
    lines.slice(start).forEach(line => {
      const el = document.createElement('span');
      if (!line.trim()) {
        el.className = 'lyric-blank';
      } else if (isEn(line)) {
        el.className = 'lyric-en';
        el.textContent = line;
      } else {
        el.className = 'lyric-zh';
        el.textContent = line;
      }
      container.appendChild(el);
    });
    container.querySelectorAll('.lyric-en,.lyric-zh,.lyric-blank').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), i * 26);
    });
  }

  // ── Share ──
  document.getElementById('page-share').addEventListener('click', () => {
    if (currentIndex < 0) return;
    const url = window.location.href;
    const showToast = (msg) => {
      const toast = document.getElementById('share-toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url)
        .then(() => showToast('已複製連結！'))
        .catch(() => copyFallback(url, showToast));
    } else {
      copyFallback(url, showToast);
    }
  });

  function copyFallback(text, showToast) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已複製連結！');
    } catch (e) {
      showToast('複製失敗，請手動複製網址');
    }
  }

  // ── Playback ──
  function togglePlay() {
    if (!songs.length || currentIndex < 0) return;
    if (isPlaying) audio.pause(); else audio.play();
  }
  function updatePlayBtn() {
    document.getElementById('btn-play').innerHTML = isPlaying ? '&#9646;&#9646;' : '&#9654;';
  }
  function markPlaying() {
    document.querySelectorAll('.toc-item').forEach((el, i) =>
      el.classList.toggle('playing', i === currentIndex && isPlaying));
  }
  function nextTrack() {
    if (!songs.length) return;
    let idx;
    if (playMode === 'shuffle') {
      do { idx = Math.floor(Math.random() * songs.length); }
      while (songs.length > 1 && idx === currentIndex);
    } else {
      idx = (currentIndex + 1) % songs.length;
    }
    selectTrack(idx);
  }
  function prevTrack() {
    if (!songs.length) return;
    selectTrack((currentIndex - 1 + songs.length) % songs.length);
  }
  function setMode(mode) {
    playMode = mode;
    audio.loop = mode === 'one';
    document.getElementById('btn-shuffle').classList.toggle('active', mode === 'shuffle');
    document.getElementById('btn-loop-all').classList.toggle('active', mode === 'all');
    document.getElementById('btn-loop-one').classList.toggle('active', mode === 'one');
  }
  document.getElementById('btn-shuffle').addEventListener('click', () =>
    setMode(playMode === 'shuffle' ? 'all' : 'shuffle'));
  document.getElementById('btn-loop-all').addEventListener('click', () =>
    setMode(playMode === 'all' ? 'shuffle' : 'all'));
  document.getElementById('btn-loop-one').addEventListener('click', () =>
    setMode(playMode === 'one' ? 'all' : 'one'));

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-thumb').style.left = pct + '%';
    document.getElementById('time-current').textContent = formatTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('time-total').textContent = formatTime(audio.duration);
  });
  audio.addEventListener('ended', () => { if (playMode !== 'one') nextTrack(); });
  audio.addEventListener('error', () => {
    if (currentIndex < 0) return;
    const toast = document.getElementById('share-toast');
    toast.textContent = '這首歌的音檔載入失敗';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  });
  audio.addEventListener('pause', () => { isPlaying = false; updatePlayBtn(); markPlaying(); document.getElementById('song-page').classList.remove('spinning'); });
  audio.addEventListener('play',  () => { isPlaying = true;  updatePlayBtn(); markPlaying(); document.getElementById('song-page').classList.add('spinning'); });

  // ── Vinyl mode: click the photo to flip it into a spinning record, lyrics tuck away ──
  document.getElementById('page-photo-wrap').addEventListener('click', () => {
    document.getElementById('song-page').classList.toggle('vinyl-on');
    vinylStartLoop();
  });
  document.getElementById('page-photo-wrap').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      document.getElementById('song-page').classList.toggle('vinyl-on');
      vinylStartLoop();
    }
  });

  // Disc rotation has real inertia: it eases up to speed like a turntable motor
  // starting up, and coasts down gradually (not an abrupt stop) when paused —
  // driven frame-by-frame rather than a fixed-speed CSS animation so the
  // acceleration/deceleration can be smooth.
  let vinylAngle = 0;
  let vinylSpeed = 0; // degrees per second
  let vinylRafId = null;
  let vinylLastTime = null;
  const VINYL_FULL_SPEED = 360 / 3.2;        // deg/sec — one rotation per 3.2s at full speed
  const VINYL_ACCEL = VINYL_FULL_SPEED / 1.2; // reach full speed over ~1.2s
  const VINYL_DECEL = VINYL_FULL_SPEED / 2.5; // coast down to a stop over ~2.5s

  function vinylTick(time) {
    if (vinylLastTime === null) vinylLastTime = time;
    const dt = Math.min((time - vinylLastTime) / 1000, 0.1); // clamp for tab-backgrounding jumps
    vinylLastTime = time;

    const target = isPlaying ? VINYL_FULL_SPEED : 0;
    if (vinylSpeed < target) vinylSpeed = Math.min(target, vinylSpeed + VINYL_ACCEL * dt);
    else if (vinylSpeed > target) vinylSpeed = Math.max(target, vinylSpeed - VINYL_DECEL * dt);
    vinylAngle = (vinylAngle + vinylSpeed * dt) % 360;

    const disc = document.getElementById('vinyl-disc');
    if (disc) disc.style.transform = 'rotate(' + vinylAngle.toFixed(2) + 'deg)';

    if (document.getElementById('song-page').classList.contains('vinyl-on')) {
      vinylRafId = requestAnimationFrame(vinylTick);
    } else {
      vinylRafId = null;
      vinylLastTime = null;
    }
  }
  function vinylStartLoop() {
    if (vinylRafId === null && document.getElementById('song-page').classList.contains('vinyl-on')) {
      vinylLastTime = null;
      vinylRafId = requestAnimationFrame(vinylTick);
    }
  }

  document.getElementById('progress-track').addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });

  const vol = document.getElementById('volume-slider');
  audio.volume = parseFloat(vol.value);
  vol.addEventListener('input', () => { audio.volume = parseFloat(vol.value); });

  document.getElementById('btn-play').addEventListener('click', togglePlay);
  document.getElementById('btn-prev').addEventListener('click', prevTrack);
  document.getElementById('btn-next').addEventListener('click', nextTrack);

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') nextTrack();
    if (e.code === 'ArrowLeft') prevTrack();
    if (e.code === 'Escape') closeToc();
  });

  function formatTime(sec) {
    if (isNaN(sec)) return '0:00';
    return Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
  }

  init();
</script>
</body>
</html>
