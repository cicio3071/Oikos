<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Box</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f5f0e8;
      --surface:    #ede8de;
      --panel:      #e6dfd3;
      --border:     #d4ccbc;
      --border2:    #c4baa8;
      --accent:     #a07840;
      --accent-glow:#c8a97e;
      --text-pri:   #2c2418;
      --text-sec:   #6b5c44;
      --text-dim:   #a89880;
      --en-font:    'DM Sans', sans-serif;
      --zh-font:    'Noto Sans TC', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-pri);
      font-family: var(--en-font);
      overflow: hidden;
    }

    #app {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100vh;
    }

    /* Sidebar */
    #sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #sidebar-header h1 {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }

    #sidebar-header p {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--zh-font);
    }

    #track-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    #track-list::-webkit-scrollbar { width: 3px; }
    #track-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .track-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 20px;
      cursor: pointer;
      transition: background 0.15s;
      border-left: 2px solid transparent;
    }

    .track-item:hover { background: var(--panel); }
    .track-item.active { background: var(--panel); border-left-color: var(--accent); }

    .track-num {
      font-size: 11px;
      color: var(--text-dim);
      width: 20px;
      flex-shrink: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .track-item.active .track-num { color: var(--accent); }

    .track-thumb {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--border);
    }

    .track-name {
      font-size: 12.5px;
      color: var(--text-sec);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s;
    }

    .track-item:hover .track-name,
    .track-item.active .track-name { color: var(--text-pri); }

    .playing-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      margin-left: auto;
      display: none;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .track-item.playing .playing-dot { display: block; }

    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.35; transform:scale(0.65); }
    }

    /* Main */
    #main {
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
    }

    #content {
      display: grid;
      grid-template-columns: 310px 1fr;
      overflow: hidden;
    }

    /* Cover side */
    #cover-side {
      padding: 36px 28px 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }

    #cover-side::-webkit-scrollbar { display: none; }

    #cover-wrap {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel);
      position: relative;
      box-shadow: 0 4px 20px rgba(120,90,40,0.10);
      transition: box-shadow 0.8s ease;
    }

    #cover-wrap.playing {
      box-shadow:
        0 4px 24px rgba(160,120,64,0.20),
        0 0 48px rgba(200,169,126,0.24),
        0 0 90px rgba(200,169,126,0.12);
      animation: glow-pulse 3s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%,100% { box-shadow: 0 4px 24px rgba(160,120,64,0.20), 0 0 48px rgba(200,169,126,0.24), 0 0 90px rgba(200,169,126,0.12); }
      50%      { box-shadow: 0 4px 32px rgba(160,120,64,0.30), 0 0 64px rgba(200,169,126,0.34), 0 0 110px rgba(200,169,126,0.18); }
    }

    #cover-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transform: scale(1.05);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #cover-img.loaded { opacity: 1; transform: scale(1); }

    #cover-placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim); font-size: 32px;
    }

    #track-title {
      font-size: 17px; font-weight: 500;
      color: var(--text-pri); line-height: 1.4; margin-bottom: 5px;
    }

    #track-index { font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; }

    /* Lyrics side */
    #lyrics-side {
      padding: 36px 40px 28px;
      overflow-y: auto;
    }

    #lyrics-side::-webkit-scrollbar { width: 3px; }
    #lyrics-side::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    #lyrics-label {
      font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 24px;
    }

    .lyric-en {
      display: block;
      color: var(--text-pri); font-size: 14px; font-family: var(--en-font);
      opacity: 0; transform: translateY(6px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .lyric-zh {
      display: block;
      color: var(--text-sec); font-size: 13px; font-weight: 300;
      font-family: var(--zh-font); margin-bottom: 2px; line-height: 1.9;
      opacity: 0; transform: translateY(6px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .lyric-blank {
      display: block; height: 14px;
      opacity: 0; transition: opacity 0.3s ease;
    }

    .lyric-en.visible, .lyric-zh.visible, .lyric-blank.visible {
      opacity: 1; transform: translateY(0);
    }

    /* Empty state */
    #empty-state {
      grid-column: 1/-1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; color: var(--text-dim);
    }

    #empty-state .icon { font-size: 36px; }
    #empty-state p { font-size: 13px; font-family: var(--zh-font); }

    /* Player bar */
    #player-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 36px 10px;
      display: flex; flex-direction: column; gap: 10px;
    }

    #progress-wrap {
      display: flex; align-items: center; gap: 12px;
    }

    .time-label {
      font-size: 11px; color: var(--text-dim);
      font-variant-numeric: tabular-nums; width: 36px; flex-shrink: 0;
    }

    #progress-track {
      flex: 1; height: 3px; background: var(--border);
      border-radius: 2px; cursor: pointer; position: relative;
      transition: height 0.15s;
    }

    #progress-track:hover { height: 5px; }

    #progress-fill {
      height: 100%; background: var(--accent);
      border-radius: 2px; width: 0%;
      pointer-events: none; position: relative; overflow: hidden;
    }

    #progress-fill::after {
      content: '';
      position: absolute; top: 0; right: -20px;
      width: 20px; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.65), transparent);
      animation: sweep 2.2s linear infinite;
    }

    @keyframes sweep {
      0%   { transform: translateX(-40px); opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateX(200px); opacity: 0; }
    }

    #progress-thumb {
      position: absolute; top: 50%;
      transform: translate(-50%,-50%);
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--accent); left: 0%;
      opacity: 0; pointer-events: none;
      transition: opacity 0.15s;
      box-shadow: 0 0 0 3px rgba(160,120,64,0.2);
    }

    #progress-track:hover #progress-thumb { opacity: 1; }

    #controls {
      display: flex; align-items: center;
      justify-content: center; position: relative;
    }

    .ctrl-btn {
      background: none; border: none;
      color: var(--text-sec); cursor: pointer;
      padding: 7px 13px; font-size: 16px;
      transition: color 0.15s, transform 0.1s;
      border-radius: 6px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }

    .ctrl-btn:hover { color: var(--text-pri); }
    .ctrl-btn:active { transform: scale(0.9); }

    #btn-play {
      font-size: 20px; color: var(--accent);
      padding: 7px 18px;
      background: rgba(160,120,64,0.08);
      border-radius: 8px;
    }

    #btn-play:hover { background: rgba(160,120,64,0.15); }

    #mode-wrap {
      position: absolute; right: 0;
      display: flex; align-items: center; gap: 2px;
    }

    .mode-btn {
      background: none; border: none;
      color: var(--text-dim); cursor: pointer;
      padding: 6px 9px; font-size: 15px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      line-height: 1;
    }

    .mode-btn:hover { color: var(--text-sec); background: var(--panel); }
    .mode-btn.active { color: var(--accent); }

    #volume-wrap {
      position: absolute; left: 0;
      display: flex; align-items: center; gap: 8px;
    }

    #volume-icon { font-size: 13px; color: var(--text-dim); }

    #volume-slider {
      -webkit-appearance: none;
      width: 72px; height: 3px;
      background: var(--border); border-radius: 2px;
      outline: none; cursor: pointer;
    }

    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--text-sec); cursor: pointer;
      transition: background 0.15s;
    }

    #volume-slider:hover::-webkit-slider-thumb { background: var(--accent); }

    #footer {
      text-align: center; padding: 4px 0 2px;
      font-size: 10px; color: var(--text-dim);
      letter-spacing: 0.05em; font-family: var(--zh-font);
    }

    audio { display: none; }

    @media (max-width: 860px) {
      #app { grid-template-columns: 250px 1fr; }
      #content { grid-template-columns: 220px 1fr; }
    }

    @media (max-width: 620px) {
      html,body { overflow: auto; }
      #app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
      #sidebar { height: 45vh; }
      #content { grid-template-columns: 1fr; }
      #cover-side { border-right: none; border-bottom: 1px solid var(--border); }
      #volume-wrap { display: none; }
    }
  </style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>Music Box</h1>
      <p id="track-count">載入中…</p>
    </div>
    <div id="track-list"></div>
  </aside>

  <main id="main">
    <div id="content">
      <div id="empty-state">
        <div class="icon">♪</div>
        <p>從左側選擇一首歌開始</p>
      </div>

      <div id="cover-side" style="display:none">
        <div id="cover-wrap">
          <div id="cover-placeholder">♪</div>
          <img id="cover-img" src="" alt="" />
        </div>
        <div id="track-info">
          <div id="track-title">—</div>
          <div id="track-index"></div>
        </div>
      </div>

      <div id="lyrics-side" style="display:none">
        <div id="lyrics-label">Lyrics</div>
        <div id="lyrics-content"></div>
      </div>
    </div>

    <div id="player-bar">
      <div id="progress-wrap">
        <span class="time-label" id="time-current">0:00</span>
        <div id="progress-track">
          <div id="progress-fill"></div>
          <div id="progress-thumb"></div>
        </div>
        <span class="time-label" id="time-total" style="text-align:right">0:00</span>
      </div>
      <div id="controls">
        <div id="volume-wrap">
          <span id="volume-icon">♪</span>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" />
        </div>
        <button class="ctrl-btn" id="btn-prev" title="上一首">&#9664;&#9664;</button>
        <button class="ctrl-btn" id="btn-play" title="播放/暫停">&#9654;</button>
        <button class="ctrl-btn" id="btn-next" title="下一首">&#9654;&#9654;</button>
        <div id="mode-wrap">
          <button class="mode-btn" id="btn-shuffle" title="隨機播放">⇄</button>
          <button class="mode-btn active" id="btn-loop-all" title="全部循環">↻</button>
          <button class="mode-btn" id="btn-loop-one" title="單曲循環">⟳</button>
        </div>
      </div>
      <div id="footer">
        Music generated with Suno · Cover art generated with Gemini / ChatGPT
      </div>
    </div>
  </main>
</div>

<audio id="audio-player" preload="none"></audio>

<script>
  const audio = document.getElementById('audio-player');
  let songs = [], currentIndex = -1, isPlaying = false, playMode = 'all';

  async function init() {
    try {
      const res = await fetch('songs.json');
      songs = await res.json();
      renderList();
      document.getElementById('track-count').textContent = songs.length + ' tracks';
    } catch {
      document.getElementById('track-count').textContent = '無法載入曲目';
    }
  }

  function renderList() {
    const list = document.getElementById('track-list');
    list.innerHTML = '';
    songs.forEach((song, i) => {
      const item = document.createElement('div');
      item.className = 'track-item';
      item.innerHTML = `
        <span class="track-num">${song.id}</span>
        <img class="track-thumb" src="images/${song.id}.png" alt="" loading="lazy" onerror="this.style.opacity='0'" />
        <span class="track-name">${song.title}</span>
        <span class="playing-dot"></span>
      `;
      item.addEventListener('click', () => selectTrack(i));
      list.appendChild(item);
    });
  }

  async function selectTrack(index) {
    currentIndex = index;
    const song = songs[index];

    document.querySelectorAll('.track-item').forEach((el, i) => {
      el.classList.toggle('active', i === index);
      el.classList.remove('playing');
    });

    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('cover-side').style.display = 'flex';
    document.getElementById('lyrics-side').style.display = 'block';

    const img = document.getElementById('cover-img');
    img.classList.remove('loaded');
    img.src = 'images/' + song.id + '.png';
    img.onload = () => img.classList.add('loaded');

    document.getElementById('track-title').textContent = song.title;
    document.getElementById('track-index').textContent =
      'Track ' + song.id + ' / ' + String(songs.length).padStart(2,'0');

    audio.src = 'audio/' + song.id + '.mp3';
    audio.load();
    playAudio();

    document.getElementById('lyrics-content').innerHTML =
      '<span style="color:var(--text-dim);font-family:var(--zh-font);font-size:13px">載入中…</span>';
    loadLyrics(song.id);

    const activeItem = document.querySelector('.track-item.active');
    if (activeItem) activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  async function loadLyrics(id) {
    const container = document.getElementById('lyrics-content');
    try {
      const res = await fetch('lyrics/' + id + '.txt');
      if (!res.ok) throw new Error();
      renderLyrics(await res.text(), container);
    } catch {
      container.innerHTML = '<span style="color:var(--text-dim);font-family:var(--zh-font);font-size:13px">歌詞未載入</span>';
    }
  }

  function renderLyrics(text, container) {
    const isEn = s => /^[\x00-\x7F\u00C0-\u024F\u0370-\u03FF\u1F00-\u1FFF\s]+$/.test(s.trim());
    const lines = text.split('\n');
    let start = 0;
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      if (i === 0 && !lines[i].match(/[,.'!?，。！？]/)) start = i + 1;
      break;
    }
    container.innerHTML = '';
    lines.slice(start).forEach(line => {
      const el = document.createElement('span');
      if (!line.trim()) {
        el.className = 'lyric-blank';
      } else if (isEn(line)) {
        el.className = 'lyric-en';
        el.textContent = line;
      } else {
        el.className = 'lyric-zh';
        el.textContent = line;
      }
      container.appendChild(el);
    });
    container.querySelectorAll('.lyric-en,.lyric-zh,.lyric-blank').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), i * 28);
    });
  }

  function playAudio() {
    audio.play().catch(() => {});
  }

  function togglePlay() {
    if (!songs.length || currentIndex < 0) return;
    if (isPlaying) audio.pause(); else audio.play();
  }

  function updatePlayBtn() {
    document.getElementById('btn-play').innerHTML = isPlaying ? '&#9646;&#9646;' : '&#9654;';
  }

  function markPlaying() {
    document.querySelectorAll('.track-item').forEach((el, i) =>
      el.classList.toggle('playing', i === currentIndex && isPlaying));
  }

  function updateGlow() {
    document.getElementById('cover-wrap').classList.toggle('playing', isPlaying);
  }

  function nextTrack() {
    if (!songs.length) return;
    let idx;
    if (playMode === 'shuffle') {
      do { idx = Math.floor(Math.random() * songs.length); }
      while (songs.length > 1 && idx === currentIndex);
    } else {
      idx = (currentIndex + 1) % songs.length;
    }
    selectTrack(idx);
  }

  function prevTrack() {
    if (!songs.length) return;
    selectTrack((currentIndex - 1 + songs.length) % songs.length);
  }

  function setMode(mode) {
    playMode = mode;
    audio.loop = mode === 'one';
    document.getElementById('btn-shuffle').classList.toggle('active', mode === 'shuffle');
    document.getElementById('btn-loop-all').classList.toggle('active', mode === 'all');
    document.getElementById('btn-loop-one').classList.toggle('active', mode === 'one');
  }

  document.getElementById('btn-shuffle').addEventListener('click', () =>
    setMode(playMode === 'shuffle' ? 'all' : 'shuffle'));
  document.getElementById('btn-loop-all').addEventListener('click', () =>
    setMode(playMode === 'all' ? 'shuffle' : 'all'));
  document.getElementById('btn-loop-one').addEventListener('click', () =>
    setMode(playMode === 'one' ? 'all' : 'one'));

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-thumb').style.left = pct + '%';
    document.getElementById('time-current').textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('time-total').textContent = formatTime(audio.duration);
  });

  audio.addEventListener('ended', () => { if (playMode !== 'one') nextTrack(); });
  audio.addEventListener('pause', () => { isPlaying = false; updatePlayBtn(); markPlaying(); updateGlow(); });
  audio.addEventListener('play',  () => { isPlaying = true;  updatePlayBtn(); markPlaying(); updateGlow(); });

  document.getElementById('progress-track').addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });

  const vol = document.getElementById('volume-slider');
  audio.volume = parseFloat(vol.value);
  vol.addEventListener('input', () => { audio.volume = parseFloat(vol.value); });

  document.getElementById('btn-play').addEventListener('click', togglePlay);
  document.getElementById('btn-prev').addEventListener('click', prevTrack);
  document.getElementById('btn-next').addEventListener('click', nextTrack);

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') nextTrack();
    if (e.code === 'ArrowLeft') prevTrack();
  });

  function formatTime(sec) {
    if (isNaN(sec)) return '0:00';
    return Math.floor(sec/60) + ':' + String(Math.floor(sec%60)).padStart(2,'0');
  }

  init();
</script>
</body>
</html>
