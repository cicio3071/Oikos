<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Box</title>
  <meta property="og:title" content="Music Box" />
  <meta property="og:description" content="You are my Oikos" />
  <meta property="og:image" content="https://cicio3071.github.io/Oikos/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cicio3071.github.io/Oikos/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://cicio3071.github.io/Oikos/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Noto+Sans+TC:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Themes ── */
    :root {
      --bg:       #f5f0e8;
      --surface:  #ede8de;
      --panel:    #e6dfd3;
      --border:   #d4ccbc;
      --border2:  #c4baa8;
      --accent:   #a07840;
      --accent2:  #c8a97e;
      --text-pri: #2c2418;
      --text-sec: #6b5c44;
      --text-dim: #a89880;
      --en-font:  'DM Sans', sans-serif;
      --zh-font:  'Noto Sans TC', sans-serif;
      --el-font:  'EB Garamond', serif;
    }

    [data-theme="deepsea"] {
      --bg:       #0d1b2a;
      --surface:  #112236;
      --panel:    #162c44;
      --border:   #1e3a55;
      --border2:  #264d70;
      --accent:   #5eb8c8;
      --accent2:  #8dd4e0;
      --text-pri: #d8eef4;
      --text-sec: #7ab8cc;
      --text-dim: #3a6880;
    }

    [data-theme="dusk"] {
      --bg:       #1e0e08;
      --surface:  #2a1510;
      --panel:    #361c14;
      --border:   #4a2618;
      --border2:  #623222;
      --accent:   #e8884a;
      --accent2:  #f0aa70;
      --text-pri: #f4dcc8;
      --text-sec: #c8906a;
      --text-dim: #7a4830;
    }

    [data-theme="mist"] {
      --bg:       #eef2f6;
      --surface:  #e4eaf0;
      --panel:    #d8e2ec;
      --border:   #c4d0de;
      --border2:  #aabcce;
      --accent:   #4a7a9a;
      --accent2:  #78a8c0;
      --text-pri: #1a2e3e;
      --text-sec: #3a607a;
      --text-dim: #7a9aae;
    }

    [data-theme="midnight"] {
      --bg:       #080c14;
      --surface:  #0e1420;
      --panel:    #141c2e;
      --border:   #1c2840;
      --border2:  #263654;
      --accent:   #c8d8f0;
      --accent2:  #e0eaff;
      --text-pri: #e8eef8;
      --text-sec: #90a8cc;
      --text-dim: #3a5070;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-pri);
      font-family: var(--en-font);
      overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ── Desktop layout ── */
    #app {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
    }

    /* ── Sidebar ── */
    #sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      transition: background 0.4s ease, border-color 0.4s ease;
      z-index: 10;
    }

    #sidebar-header {
      padding: 22px 22px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }

    #sidebar-header h1 {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent);
    }

    #sidebar-header p { font-size: 11px; color: var(--text-dim); font-family: var(--zh-font); margin-top: 3px; }

    #track-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    #track-list::-webkit-scrollbar { width: 3px; }
    #track-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .track-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 18px; cursor: pointer;
      transition: background 0.15s;
      border-left: 2px solid transparent;
    }
    .track-item:hover { background: var(--panel); }
    .track-item.active { background: var(--panel); border-left-color: var(--accent); }

    .track-num {
      font-size: 11px; color: var(--text-dim);
      width: 18px; flex-shrink: 0; text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .track-item.active .track-num { color: var(--accent); }

    .track-thumb {
      width: 36px; height: 36px; border-radius: 6px;
      object-fit: cover; flex-shrink: 0; background: var(--border);
    }

    .track-name {
      font-size: 12px; color: var(--text-sec);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color 0.15s;
    }
    .track-item:hover .track-name,
    .track-item.active .track-name { color: var(--text-pri); }

    .playing-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
      margin-left: auto; display: none;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .track-item.playing .playing-dot { display: block; }

    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.3; transform:scale(0.6); }
    }

    /* ── Theme switcher in sidebar footer ── */
    #theme-bar {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }

    #theme-label {
      font-size: 10px; color: var(--text-dim);
      letter-spacing: 0.12em; text-transform: uppercase;
      margin-right: 4px;
    }

    .theme-dot {
      width: 16px; height: 16px; border-radius: 50%;
      cursor: pointer; border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .theme-dot:hover { transform: scale(1.2); }
    .theme-dot.active { border-color: var(--accent); }
    .theme-dot[data-t="parchment"] { background: #c8a97e; }
    .theme-dot[data-t="deepsea"]   { background: #5eb8c8; }
    .theme-dot[data-t="dusk"]      { background: #e8884a; }
    .theme-dot[data-t="mist"]      { background: #4a7a9a; }
    .theme-dot[data-t="midnight"]  { background: #6080b0; }

    /* ── Main ── */
    #main {
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
    }

    #content {
      display: grid;
      grid-template-columns: 380px 1fr;
      overflow: hidden;
    }

    /* ── Cover side ── */
    #cover-side {
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
      background: var(--surface);
      transition: background 0.4s ease;
    }

    #cover-wrap {
      width: 100%; aspect-ratio: 16/9;
      flex-shrink: 0; overflow: hidden;
      background: var(--panel); position: relative;
      transition: box-shadow 0.8s ease;
    }

    #cover-wrap.playing { animation: glow-pulse 3s ease-in-out infinite; }

    @keyframes glow-pulse {
      0%,100% { box-shadow: 0 4px 32px rgba(var(--glow-rgb, 160,120,64),0.14), inset 0 0 40px rgba(var(--glow-rgb, 200,169,126),0.07); }
      50%      { box-shadow: 0 4px 48px rgba(var(--glow-rgb, 160,120,64),0.24), inset 0 0 60px rgba(var(--glow-rgb, 200,169,126),0.13); }
    }

    #cover-img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      opacity: 0; transform: scale(1.03);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #cover-img.loaded { opacity: 1; transform: scale(1); }

    #cover-placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim); font-size: 28px;
    }

    #track-info { padding: 14px 22px 0; flex-shrink: 0; }

    #track-title {
      font-size: 15px; font-weight: 500;
      color: var(--text-pri); line-height: 1.4; margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    #track-index { font-size: 11px; color: var(--text-dim); letter-spacing: 0.08em; }

    /* Share button */
    #share-btn {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 10px;
      background: none; border: 1px solid var(--border2);
      color: var(--text-dim); font-size: 11px;
      font-family: var(--en-font); letter-spacing: 0.08em;
      padding: 4px 10px; border-radius: 20px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    #share-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--panel); }

    #share-toast {
      display: inline-block; margin-left: 8px;
      font-size: 11px; color: var(--accent);
      font-family: var(--zh-font);
      opacity: 0; transition: opacity 0.3s ease;
    }
    #share-toast.show { opacity: 1; }

    /* Wave divider */
    .wave-divider { width: 100%; flex-shrink: 0; overflow: hidden; line-height: 0; margin-top: 14px; }
    .wave-divider svg { display: block; width: 100%; height: 24px; }

    /* ── Lyrics ── */
    #lyrics-side {
      padding: 28px 36px 20px;
      overflow-y: auto; background: var(--bg);
      transition: background 0.4s ease;
    }
    #lyrics-side::-webkit-scrollbar { width: 3px; }
    #lyrics-side::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    #lyrics-label {
      font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 20px;
    }

    .lyric-en {
      display: block; color: var(--text-pri);
      font-size: 14px; font-family: var(--en-font); line-height: 1.75;
      opacity: 0; transform: translateY(5px);
      transition: opacity 0.38s ease, transform 0.38s ease;
    }
    .lyric-zh {
      display: block; color: var(--text-sec);
      font-size: 12.5px; font-weight: 300; font-family: var(--zh-font);
      line-height: 1.75; margin-bottom: 1px;
      opacity: 0; transform: translateY(5px);
      transition: opacity 0.38s ease, transform 0.38s ease;
    }
    .lyric-blank {
      display: block; height: 12px;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .lyric-en.visible, .lyric-zh.visible, .lyric-blank.visible {
      opacity: 1; transform: translateY(0);
    }

    /* ── Empty state ── */
    #empty-state {
      grid-column: 1/-1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; padding: 40px 20px;
    }

    #empty-wave { width: min(320px, 80%); opacity: 0.45; }

    #empty-tagline {
      font-family: var(--el-font);
      font-size: clamp(20px, 3vw, 30px);
      font-style: italic;
      color: var(--accent);
      letter-spacing: 0.04em; text-align: center; line-height: 1.5;
    }

    #empty-sub {
      font-size: 12px; color: var(--text-dim);
      font-family: var(--zh-font); letter-spacing: 0.05em;
    }

    /* ── Player bar ── */
    #player-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 32px 10px;
      display: flex; flex-direction: column; gap: 9px;
      transition: background 0.4s ease;
    }

    #progress-wrap { display: flex; align-items: center; gap: 10px; }

    .time-label {
      font-size: 11px; color: var(--text-dim);
      font-variant-numeric: tabular-nums; width: 34px; flex-shrink: 0;
    }

    #progress-track {
      flex: 1; height: 3px; background: var(--border);
      border-radius: 2px; cursor: pointer; position: relative;
      transition: height 0.15s;
    }
    #progress-track:hover { height: 5px; }

    #progress-fill {
      height: 100%; background: var(--accent);
      border-radius: 2px; width: 0%;
      pointer-events: none; position: relative; overflow: hidden;
    }
    #progress-fill::after {
      content: '';
      position: absolute; top: 0; right: 0;
      width: 40px; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      animation: sweep 2.4s linear infinite;
    }
    @keyframes sweep {
      0%   { transform: translateX(-60px); opacity: 0; }
      15%  { opacity: 1; } 85% { opacity: 1; }
      100% { transform: translateX(400px); opacity: 0; }
    }

    #progress-thumb {
      position: absolute; top: 50%; transform: translate(-50%,-50%);
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--accent); left: 0%;
      opacity: 0; pointer-events: none; transition: opacity 0.15s;
      box-shadow: 0 0 0 3px rgba(160,120,64,0.18);
    }
    #progress-track:hover #progress-thumb { opacity: 1; }

    #controls {
      display: flex; align-items: center;
      justify-content: center; position: relative;
    }

    .ctrl-btn {
      background: none; border: none; color: var(--text-sec);
      cursor: pointer; padding: 6px 12px; font-size: 15px;
      transition: color 0.15s, transform 0.1s;
      border-radius: 6px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .ctrl-btn:hover { color: var(--text-pri); }
    .ctrl-btn:active { transform: scale(0.9); }

    #btn-play {
      font-size: 19px; color: var(--accent);
      padding: 6px 16px;
      background: rgba(160,120,64,0.09); border-radius: 8px;
    }
    #btn-play:hover { background: rgba(160,120,64,0.16); }

    #mode-wrap {
      position: absolute; right: 0;
      display: flex; align-items: center; gap: 1px;
    }
    .mode-btn {
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; padding: 5px 8px; font-size: 14px;
      border-radius: 6px; transition: color 0.15s, background 0.15s; line-height: 1;
    }
    .mode-btn:hover { color: var(--text-sec); background: var(--panel); }
    .mode-btn.active { color: var(--accent); }

    #volume-wrap {
      position: absolute; left: 0;
      display: flex; align-items: center; gap: 7px;
    }
    #volume-icon { font-size: 12px; color: var(--text-dim); }
    #volume-slider {
      -webkit-appearance: none; width: 68px; height: 3px;
      background: var(--border); border-radius: 2px; outline: none; cursor: pointer;
    }
    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px;
      border-radius: 50%; background: var(--text-sec); cursor: pointer;
      transition: background 0.15s;
    }
    #volume-slider:hover::-webkit-slider-thumb { background: var(--accent); }

    #footer {
      text-align: center; padding: 3px 0 1px;
      font-size: 10px; color: var(--text-dim);
      letter-spacing: 0.05em; font-family: var(--zh-font);
    }

    audio { display: none; }

    /* ── Mobile top bar (hidden on desktop) ── */
    #mobile-topbar {
      display: none;
      align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #btn-drawer {
      background: none; border: none; cursor: pointer;
      color: var(--text-sec); font-size: 20px; line-height: 1;
      padding: 4px 6px; border-radius: 6px;
    }
    #btn-drawer:hover { color: var(--text-pri); }

    #mobile-title { font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }

    #mobile-now-playing {
      font-size: 11px; color: var(--text-dim);
      font-family: var(--zh-font); max-width: 140px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-align: right;
    }

    /* ── Drawer overlay ── */
    #drawer-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 100;
    }

    #drawer-overlay.open { display: block; }

    #drawer-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.35);
    }

    #drawer-panel {
      position: absolute; top: 0; left: 0; bottom: 0;
      width: 75vw; max-width: 300px;
      background: var(--surface);
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.28s ease;
    }

    #drawer-overlay.open #drawer-panel { transform: translateX(0); }

    #drawer-header {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }

    #drawer-header span { font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }

    #btn-drawer-close {
      background: none; border: none; cursor: pointer;
      color: var(--text-dim); font-size: 18px; line-height: 1; padding: 2px 4px;
    }

    #drawer-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    #drawer-list::-webkit-scrollbar { width: 3px; }
    #drawer-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* Theme dots in drawer footer */
    #drawer-theme-bar {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }

    /* ── Responsive ── */
    @media (max-width: 960px) {
      #content { grid-template-columns: 300px 1fr; }
    }
    @media (max-width: 760px) {
      #app { grid-template-columns: 200px 1fr; }
      #content { grid-template-columns: 220px 1fr; }
      #lyrics-side { padding: 20px 18px 16px; }
    }

    /* ── Mobile ── */
    @media (max-width: 560px) {
      html, body { overflow: auto; }

      #app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
        overflow: hidden;
      }

      #mobile-topbar { display: flex; }

      #sidebar { display: none; }

      #main {
        display: flex; flex-direction: column;
        overflow: hidden; flex: 1;
      }

      #content {
        display: flex; flex-direction: column;
        flex: 1; overflow-y: auto;
        grid-template-columns: unset;
      }

      #cover-side {
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      #lyrics-side {
        overflow-y: visible;
        padding: 18px 18px 16px;
        flex: 1;
      }

      #empty-state { grid-column: 1; min-height: 60vh; }

      #player-bar {
        padding: 10px 16px 12px;
        flex-shrink: 0;
      }

      #volume-wrap { display: none; }

      #mode-wrap { position: static; margin-left: auto; }
      #controls { gap: 2px; }

      .wave-divider svg { height: 18px; }

      #track-info { padding: 12px 16px 0; }

      #share-btn { margin-top: 8px; }

      #theme-bar { display: none; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Mobile top bar -->
  <div id="mobile-topbar">
    <button id="btn-drawer">☰</button>
    <span id="mobile-title">Music Box</span>
    <div id="mobile-now-playing">選擇一首歌</div>
  </div>

  <!-- Sidebar (desktop) -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <div>
        <h1>Music Box</h1>
        <p id="track-count">載入中…</p>
      </div>
    </div>
    <div id="track-list"></div>
    <div id="theme-bar">
      <span id="theme-label">Theme</span>
      <div class="theme-dot active" data-t="parchment" title="Parchment"></div>
      <div class="theme-dot" data-t="deepsea" title="Deep Sea"></div>
      <div class="theme-dot" data-t="dusk" title="Dusk"></div>
      <div class="theme-dot" data-t="mist" title="Mist"></div>
      <div class="theme-dot" data-t="midnight" title="Midnight"></div>
    </div>
  </aside>

  <!-- Drawer overlay (mobile) -->
  <div id="drawer-overlay">
    <div id="drawer-backdrop"></div>
    <div id="drawer-panel">
      <div id="drawer-header">
        <span>Music Box</span>
        <button id="btn-drawer-close">✕</button>
      </div>
      <div id="drawer-list"></div>
      <div id="drawer-theme-bar">
        <span id="theme-label" style="font-size:10px;color:var(--text-dim);letter-spacing:0.12em;text-transform:uppercase;margin-right:4px;">Theme</span>
        <div class="theme-dot active" data-t="parchment" title="Parchment"></div>
        <div class="theme-dot" data-t="deepsea" title="Deep Sea"></div>
        <div class="theme-dot" data-t="dusk" title="Dusk"></div>
        <div class="theme-dot" data-t="mist" title="Mist"></div>
        <div class="theme-dot" data-t="midnight" title="Midnight"></div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <main id="main">
    <div id="content">

      <!-- Empty state -->
      <div id="empty-state">
        <svg id="empty-wave" viewBox="0 0 320 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 30 C20 10,40 50,60 30 C80 10,100 50,120 30 C140 10,160 50,180 30 C200 10,220 50,240 30 C260 10,280 50,300 30 C310 20,315 25,320 30"
            stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" fill="none">
            <animate attributeName="d"
              values="M0 30 C20 10,40 50,60 30 C80 10,100 50,120 30 C140 10,160 50,180 30 C200 10,220 50,240 30 C260 10,280 50,300 30 C310 20,315 25,320 30;M0 30 C20 50,40 10,60 30 C80 50,100 10,120 30 C140 50,160 10,180 30 C200 50,220 10,240 30 C260 50,280 10,300 30 C310 40,315 35,320 30;M0 30 C20 10,40 50,60 30 C80 10,100 50,120 30 C140 10,160 50,180 30 C200 10,220 50,240 30 C260 10,280 50,300 30 C310 20,315 25,320 30"
              dur="4s" repeatCount="indefinite" />
          </path>
          <path d="M0 40 C20 20,40 60,60 40 C80 20,100 60,120 40 C140 20,160 60,180 40 C200 20,220 60,240 40 C260 20,280 60,300 40 C310 30,315 35,320 40"
            stroke="var(--accent2)" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.5">
            <animate attributeName="d"
              values="M0 40 C20 20,40 60,60 40 C80 20,100 60,120 40 C140 20,160 60,180 40 C200 20,220 60,240 40 C260 20,280 60,300 40 C310 30,315 35,320 40;M0 40 C20 60,40 20,60 40 C80 60,100 20,120 40 C140 60,160 20,180 40 C200 60,220 20,240 40 C260 60,280 20,300 40 C310 50,315 45,320 40;M0 40 C20 20,40 60,60 40 C80 20,100 60,120 40 C140 20,160 60,180 40 C200 20,220 60,240 40 C260 20,280 60,300 40 C310 30,315 35,320 40"
              dur="6s" repeatCount="indefinite" />
          </path>
        </svg>
        <div id="empty-tagline">Ἐν τῇ ψυχῇ μου ἔχεις</div>
        <div id="empty-sub">從左側選擇一首歌開始</div>
      </div>

      <!-- Cover side -->
      <div id="cover-side" style="display:none">
        <div id="cover-wrap">
          <div id="cover-placeholder">♪</div>
          <img id="cover-img" src="" alt="" />
        </div>
        <div id="track-info">
          <div id="track-title">—</div>
          <div id="track-index"></div>
          <button id="share-btn">⬡ Share</button>
          <span id="share-toast">已複製連結！</span>
        </div>
        <div class="wave-divider">
          <svg viewBox="0 0 380 24" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 12 C24 4,48 20,72 12 C96 4,120 20,144 12 C168 4,192 20,216 12 C240 4,264 20,288 12 C312 4,336 20,360 12 C368 8,374 10,380 12"
              stroke="var(--border2)" stroke-width="1" fill="none" stroke-linecap="round">
              <animate attributeName="d"
                values="M0 12 C24 4,48 20,72 12 C96 4,120 20,144 12 C168 4,192 20,216 12 C240 4,264 20,288 12 C312 4,336 20,360 12 C368 8,374 10,380 12;M0 12 C24 20,48 4,72 12 C96 20,120 4,144 12 C168 20,192 4,216 12 C240 20,264 4,288 12 C312 20,336 4,360 12 C368 16,374 14,380 12;M0 12 C24 4,48 20,72 12 C96 4,120 20,144 12 C168 4,192 20,216 12 C240 4,264 20,288 12 C312 4,336 20,360 12 C368 8,374 10,380 12"
                dur="5s" repeatCount="indefinite" />
            </path>
            <path d="M0 17 C24 9,48 25,72 17 C96 9,120 25,144 17 C168 9,192 25,216 17 C240 9,264 25,288 17 C312 9,336 25,360 17 C368 13,374 15,380 17"
              stroke="var(--border)" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.6">
              <animate attributeName="d"
                values="M0 17 C24 9,48 25,72 17 C96 9,120 25,144 17 C168 9,192 25,216 17 C240 9,264 25,288 17 C312 9,336 25,360 17 C368 13,374 15,380 17;M0 17 C24 25,48 9,72 17 C96 25,120 9,144 17 C168 25,192 9,216 17 C240 25,264 9,288 17 C312 25,336 9,360 17 C368 21,374 19,380 17;M0 17 C24 9,48 25,72 17 C96 9,120 25,144 17 C168 9,192 25,216 17 C240 9,264 25,288 17 C312 9,336 25,360 17 C368 13,374 15,380 17"
                dur="7s" repeatCount="indefinite" />
            </path>
          </svg>
        </div>
      </div>

      <!-- Lyrics -->
      <div id="lyrics-side" style="display:none">
        <div id="lyrics-label">Lyrics</div>
        <div id="lyrics-content"></div>
      </div>

    </div>

    <!-- Player bar -->
    <div id="player-bar">
      <div id="progress-wrap">
        <span class="time-label" id="time-current">0:00</span>
        <div id="progress-track">
          <div id="progress-fill"></div>
          <div id="progress-thumb"></div>
        </div>
        <span class="time-label" id="time-total" style="text-align:right">0:00</span>
      </div>
      <div id="controls">
        <div id="volume-wrap">
          <span id="volume-icon">♪</span>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" />
        </div>
        <button class="ctrl-btn" id="btn-prev" title="上一首">&#9664;&#9664;</button>
        <button class="ctrl-btn" id="btn-play" title="播放/暫停">&#9654;</button>
        <button class="ctrl-btn" id="btn-next" title="下一首">&#9654;&#9654;</button>
        <div id="mode-wrap">
          <button class="mode-btn" id="btn-shuffle" title="隨機播放">⇄</button>
          <button class="mode-btn active" id="btn-loop-all" title="全部循環">↻</button>
          <button class="mode-btn" id="btn-loop-one" title="單曲循環">⟳</button>
        </div>
      </div>
      <div id="footer">
        Music generated with Suno · Cover art generated with Gemini / ChatGPT
      </div>
    </div>
  </main>
</div>

<audio id="audio-player" preload="none"></audio>

<script>
  const audio = document.getElementById('audio-player');
  let songs = [], currentIndex = -1, isPlaying = false, playMode = 'all';

  // ── Theme ──
  const themes = ['parchment','deepsea','dusk','mist','midnight'];
  let currentTheme = localStorage.getItem('mb-theme') || 'parchment';

  function applyTheme(t) {
    currentTheme = t;
    document.documentElement.setAttribute('data-theme', t === 'parchment' ? '' : t);
    localStorage.setItem('mb-theme', t);
    document.querySelectorAll('.theme-dot').forEach(d => {
      d.classList.toggle('active', d.dataset.t === t);
    });
  }

  document.querySelectorAll('.theme-dot').forEach(d => {
    d.addEventListener('click', () => applyTheme(d.dataset.t));
  });

  applyTheme(currentTheme);

  // ── Drawer (mobile) ──
  const drawer = document.getElementById('drawer-overlay');

  function openDrawer() { drawer.classList.add('open'); }
  function closeDrawer() { drawer.classList.remove('open'); }

  document.getElementById('btn-drawer').addEventListener('click', openDrawer);
  document.getElementById('btn-drawer-close').addEventListener('click', closeDrawer);
  document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);

  // ── Init ──
  async function init() {
    try {
      const res = await fetch('songs.json');
      songs = await res.json();
      renderList();
      document.getElementById('track-count').textContent = songs.length + ' tracks';

      // check URL param
      const params = new URLSearchParams(window.location.search);
      const trackParam = params.get('track');
      if (trackParam) {
        const idx = songs.findIndex(s => s.id === trackParam.padStart(2,'0'));
        if (idx >= 0) selectTrack(idx);
      }
    } catch {
      document.getElementById('track-count').textContent = '無法載入曲目';
    }
  }

  function renderList() {
    const desktopList = document.getElementById('track-list');
    const drawerList = document.getElementById('drawer-list');
    [desktopList, drawerList].forEach(list => {
      list.innerHTML = '';
      songs.forEach((song, i) => {
        const item = document.createElement('div');
        item.className = 'track-item';
        item.dataset.index = i;
        item.innerHTML = `
          <span class="track-num">${song.id}</span>
          <img class="track-thumb" src="images/${song.id}.png" alt="" loading="lazy" onerror="this.style.opacity='0'" />
          <span class="track-name">${song.title}</span>
          <span class="playing-dot"></span>
        `;
        item.addEventListener('click', () => {
          selectTrack(i);
          closeDrawer();
        });
        list.appendChild(item);
      });
    });
  }

  async function selectTrack(index) {
    currentIndex = index;
    const song = songs[index];

    document.querySelectorAll('.track-item').forEach((el, i) => {
      el.classList.toggle('active', i === index);
      el.classList.remove('playing');
    });

    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('cover-side').style.display = 'flex';
    document.getElementById('lyrics-side').style.display = 'block';

    const img = document.getElementById('cover-img');
    img.classList.remove('loaded');
    img.src = 'images/' + song.id + '.png';
    img.onload = () => img.classList.add('loaded');

    document.getElementById('track-title').textContent = song.title;
    document.getElementById('track-index').textContent =
      'Track ' + song.id + ' / ' + String(songs.length).padStart(2,'0');
    document.getElementById('mobile-now-playing').textContent = song.title;

    // update URL without reload
    const url = new URL(window.location.href);
    url.searchParams.set('track', song.id);
    window.history.replaceState({}, '', url);

    audio.src = 'audio/' + song.id + '.mp3';
    audio.load();
    audio.play().catch(() => {});

    document.getElementById('lyrics-side').scrollTop = 0;
    document.getElementById('lyrics-content').innerHTML =
      '<span style="color:var(--text-dim);font-family:var(--zh-font);font-size:13px">載入中…</span>';
    loadLyrics(song.id);

    const activeItem = document.querySelector('#track-list .track-item.active');
    if (activeItem) activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  async function loadLyrics(id) {
    const container = document.getElementById('lyrics-content');
    try {
      const res = await fetch('lyrics/' + id + '.txt');
      if (!res.ok) throw new Error();
      renderLyrics(await res.text(), container);
    } catch {
      container.innerHTML = '<span style="color:var(--text-dim);font-family:var(--zh-font);font-size:13px">歌詞未載入</span>';
    }
  }

  function renderLyrics(text, container) {
    const isEn = s => /^[\x00-\x7F\u00C0-\u024F\u0370-\u03FF\u1F00-\u1FFF\u2018\u2019\u201C\u201D\u2014\u2013\s]+$/.test(s.trim());
    const lines = text.split('\n');
    let start = 0;
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      if (i === 0 && !lines[i].match(/[,.'!?，。！？]/)) start = i + 1;
      break;
    }
    container.innerHTML = '';
    lines.slice(start).forEach(line => {
      const el = document.createElement('span');
      if (!line.trim()) {
        el.className = 'lyric-blank';
      } else if (isEn(line)) {
        el.className = 'lyric-en';
        el.textContent = line;
      } else {
        el.className = 'lyric-zh';
        el.textContent = line;
      }
      container.appendChild(el);
    });
    container.querySelectorAll('.lyric-en,.lyric-zh,.lyric-blank').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), i * 28);
    });
  }

  // ── Share button ──
  document.getElementById('share-btn').addEventListener('click', () => {
    if (currentIndex < 0) return;
    const url = window.location.href;
    navigator.clipboard.writeText(url).then(() => {
      const toast = document.getElementById('share-toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });
  });

  // ── Playback ──
  function togglePlay() {
    if (!songs.length || currentIndex < 0) return;
    if (isPlaying) audio.pause(); else audio.play();
  }

  function updatePlayBtn() {
    document.getElementById('btn-play').innerHTML = isPlaying ? '&#9646;&#9646;' : '&#9654;';
  }

  function markPlaying() {
    document.querySelectorAll('.track-item').forEach((el, i) =>
      el.classList.toggle('playing', i === currentIndex && isPlaying));
  }

  function updateGlow() {
    document.getElementById('cover-wrap').classList.toggle('playing', isPlaying);
  }

  function nextTrack() {
    if (!songs.length) return;
    let idx;
    if (playMode === 'shuffle') {
      do { idx = Math.floor(Math.random() * songs.length); }
      while (songs.length > 1 && idx === currentIndex);
    } else {
      idx = (currentIndex + 1) % songs.length;
    }
    selectTrack(idx);
  }

  function prevTrack() {
    if (!songs.length) return;
    selectTrack((currentIndex - 1 + songs.length) % songs.length);
  }

  function setMode(mode) {
    playMode = mode;
    audio.loop = mode === 'one';
    document.getElementById('btn-shuffle').classList.toggle('active', mode === 'shuffle');
    document.getElementById('btn-loop-all').classList.toggle('active', mode === 'all');
    document.getElementById('btn-loop-one').classList.toggle('active', mode === 'one');
  }

  document.getElementById('btn-shuffle').addEventListener('click', () =>
    setMode(playMode === 'shuffle' ? 'all' : 'shuffle'));
  document.getElementById('btn-loop-all').addEventListener('click', () =>
    setMode(playMode === 'all' ? 'shuffle' : 'all'));
  document.getElementById('btn-loop-one').addEventListener('click', () =>
    setMode(playMode === 'one' ? 'all' : 'one'));

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-thumb').style.left = pct + '%';
    document.getElementById('time-current').textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('time-total').textContent = formatTime(audio.duration);
  });

  audio.addEventListener('ended', () => { if (playMode !== 'one') nextTrack(); });
  audio.addEventListener('pause', () => { isPlaying = false; updatePlayBtn(); markPlaying(); updateGlow(); });
  audio.addEventListener('play',  () => { isPlaying = true;  updatePlayBtn(); markPlaying(); updateGlow(); });

  document.getElementById('progress-track').addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });

  const vol = document.getElementById('volume-slider');
  audio.volume = parseFloat(vol.value);
  vol.addEventListener('input', () => { audio.volume = parseFloat(vol.value); });

  document.getElementById('btn-play').addEventListener('click', togglePlay);
  document.getElementById('btn-prev').addEventListener('click', prevTrack);
  document.getElementById('btn-next').addEventListener('click', nextTrack);

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') nextTrack();
    if (e.code === 'ArrowLeft') prevTrack();
  });

  function formatTime(sec) {
    if (isNaN(sec)) return '0:00';
    return Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
  }

  init();
</script>
</body>
</html>
