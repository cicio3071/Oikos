<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oikos</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" sizes="64x64" />
  <meta property="og:title" content="Oikos" />
  <meta property="og:description" content="You are my Oikos" />
  <meta property="og:image" content="https://cicio3071.github.io/Oikos/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cicio3071.github.io/Oikos/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://cicio3071.github.io/Oikos/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Noto+Sans+TC:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Themes (unchanged from original tuning) ── */
    :root {
      --surface:  #ede8de;
      --panel:    #e6dfd3;
      --border:   #d4ccbc;
      --border2:  #c4baa8;
      --accent:   #a07840;
      --accent2:  #c8a97e;
      --text-pri: #2c2418;
      --text-sec: #6b5c44;
      --text-dim: #a89880;
      --en-font:  'DM Sans', sans-serif;
      --zh-font:  'Noto Sans TC', sans-serif;
      --el-font:  'EB Garamond', serif;
    }

    [data-theme="deepsea"] {
      --bg:       #0d1b2a;
      --surface:  #112236;
      --panel:    #162c44;
      --border:   #1e3a55;
      --border2:  #264d70;
      --accent:   #5eb8c8;
      --accent2:  #8dd4e0;
      --text-pri: #d8eef4;
      --text-sec: #7ab8cc;
      --text-dim: #3a6880;
    }

    [data-theme="dusk"] {
      --bg:       #1e0e08;
      --surface:  #2a1510;
      --panel:    #361c14;
      --border:   #4a2618;
      --border2:  #623222;
      --accent:   #e8884a;
      --accent2:  #f0aa70;
      --text-pri: #f4dcc8;
      --text-sec: #c8906a;
      --text-dim: #7a4830;
    }

    [data-theme="mist"] {
      --bg:       #eef2f6;
      --surface:  #e4eaf0;
      --panel:    #d8e2ec;
      --border:   #c4d0de;
      --border2:  #aabcce;
      --accent:   #4a7a9a;
      --accent2:  #78a8c0;
      --text-pri: #1a2e3e;
      --text-sec: #3a607a;
      --text-dim: #7a9aae;
    }

    [data-theme="midnight"] {
      --bg:       #080c14;
      --surface:  #0e1420;
      --panel:    #141c2e;
      --border:   #1c2840;
      --border2:  #263654;
      --accent:   #c8d8f0;
      --accent2:  #e0eaff;
      --text-pri: #e8eef8;
      --text-sec: #90a8cc;
      --text-dim: #3a5070;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-pri);
      font-family: var(--en-font);
      overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ── Paper grain (SVG turbulence, no image asset needed) ── */
    .grain {
      position: absolute; inset: 0; pointer-events: none;
      opacity: 0.05; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    [data-theme="deepsea"] .grain, [data-theme="dusk"] .grain,
    [data-theme="midnight"] .grain { mix-blend-mode: overlay; opacity: 0.06; }

    #app { position: relative; width: 100%; height: 100%; overflow: hidden; }

    /* ── Bookmark tab (目錄 entry point, all breakpoints) ── */
    #toc-tab {
      position: fixed; top: 28px; left: 0; z-index: 40;
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px 12px 14px;
      background: var(--accent); color: var(--bg);
      border: none; border-radius: 0 10px 10px 0;
      font-family: var(--el-font); font-size: 14px; letter-spacing: 0.08em;
      cursor: pointer; box-shadow: 3px 3px 12px rgba(0,0,0,0.18);
      transition: padding 0.2s ease, transform 0.2s ease;
    }
    #toc-tab:hover { padding-right: 22px; transform: translateX(2px); }
    #toc-tab-icon { font-size: 15px; line-height: 1; }

    /* ── TOC drawer/overlay ── */
    #toc-overlay {
      position: fixed; inset: 0; z-index: 50;
      pointer-events: none; opacity: 0;
      transition: opacity 0.28s ease;
    }
    #toc-overlay.open { pointer-events: auto; opacity: 1; }
    #toc-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.32);
    }
    #toc-panel {
      position: absolute; top: 0; left: 0; height: 100%;
      width: 340px; max-width: 86vw;
      background: var(--surface);
      border-right: 1px solid var(--border);
      box-shadow: 8px 0 32px rgba(0,0,0,0.2);
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.32s cubic-bezier(0.22,0.61,0.36,1);
    }
    #toc-overlay.open #toc-panel { transform: translateX(0); }

    #toc-panel-header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 26px 24px 14px;
      border-bottom: 1px solid var(--border);
    }
    #toc-panel-title {
      font-family: var(--el-font); font-style: italic; font-size: 22px;
      color: var(--text-pri); letter-spacing: 0.04em;
    }
    #toc-panel-sub, .panel-sub { font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
    #toc-close {
      background: none; border: none; color: var(--text-dim);
      font-size: 18px; cursor: pointer; padding: 4px 8px;
    }
    #toc-close:hover { color: var(--text-pri); }

    #toc-list { flex: 1; overflow-y: auto; padding: 8px 0 16px; }
    #toc-list::-webkit-scrollbar { width: 5px; }
    #toc-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    .toc-item {
      display: flex; align-items: baseline; gap: 12px;
      padding: 10px 24px;
      cursor: pointer;
      border-bottom: 1px dotted var(--border);
      transition: background 0.15s;
    }
    .toc-item:hover { background: var(--panel); }
    .toc-item.active { background: var(--panel); }
    .toc-item.active .toc-num, .toc-item.active .toc-name { color: var(--accent); }
    .toc-num {
      font-family: var(--el-font); font-style: italic; font-size: 13px;
      color: var(--text-dim); width: 22px; flex-shrink: 0;
    }
    .toc-name {
      font-family: var(--zh-font); font-size: 13.5px; color: var(--text-sec);
      line-height: 1.5;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .toc-dot {
      margin-left: auto; width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); opacity: 0; flex-shrink: 0;
    }
    .toc-item.playing .toc-dot { opacity: 1; }

    #toc-theme-bar {
      display: flex; align-items: center; gap: 9px;
      padding: 14px 24px; border-top: 1px solid var(--border);
    }
    .theme-dot {
      width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: transform 0.15s;
    }
    .theme-dot:hover { transform: scale(1.15); }
    .theme-dot.active { border-color: var(--text-pri); }
    .theme-dot[data-t="parchment"] { background: #a07840; }
    .theme-dot[data-t="deepsea"]   { background: #5eb8c8; }
    .theme-dot[data-t="dusk"]      { background: #e8884a; }
    .theme-dot[data-t="mist"]      { background: #4a7a9a; }
    .theme-dot[data-t="midnight"]  { background: #c8d8f0; }

    /* ── The book ── */
    #book { position: relative; width: 100%; height: 100%; }
    #page-wrap {
      position: absolute; inset: 0; bottom: 92px;
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .page {
      position: relative;
      min-height: 100%;
      max-width: 760px; margin: 0 auto;
      padding: 100px 48px 64px;
      opacity: 1;
      transition: opacity 0.22s ease;
    }
    .page.fading { opacity: 0; }

    /* Cover / welcome page */
    #cover-page {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; min-height: 100%; gap: 22px;
    }
    #cover-wave { width: 240px; height: auto; opacity: 0.7; }
    #cover-title {
      font-family: var(--el-font); font-style: italic; font-size: 28px;
      color: var(--text-pri); letter-spacing: 0.03em;
    }
    #cover-sub { font-family: var(--zh-font); font-size: 13px; color: var(--text-dim); }
    #cover-open-btn {
      margin-top: 6px; padding: 11px 28px;
      background: var(--accent); color: var(--bg); border: none; border-radius: 24px;
      font-family: var(--el-font); font-style: italic; font-size: 14px; letter-spacing: 0.06em;
      cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      transition: transform 0.15s;
    }
    #cover-open-btn:hover { transform: scale(1.04); }

    /* Song page */
    #song-page { display: none; }
    #page-tint {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      opacity: 0; transition: opacity 0.5s ease, background 0.5s ease;
    }
    .page > * { position: relative; z-index: 1; }

    #page-number {
      font-family: var(--el-font); font-style: italic; font-size: 12px;
      color: var(--text-dim); letter-spacing: 0.14em; text-align: center;
      margin-bottom: 28px;
    }

    #page-photo-wrap {
      display: flex; margin-bottom: 30px;
    }
    #page-photo {
      width: 280px; max-width: 62%; height: auto;
      display: block;
      -webkit-mask-image: radial-gradient(ellipse at center, black 58%, transparent 92%);
      mask-image: radial-gradient(ellipse at center, black 58%, transparent 92%);
      filter: saturate(0.94) brightness(1.01);
      box-shadow: 0 12px 34px rgba(0,0,0,0.16);
      transition: opacity 0.4s ease;
      opacity: 0;
    }
    #page-photo.loaded { opacity: 1; }

    /* three layout variants, cycled by track index for visual rhythm */
    .layout-a #page-photo-wrap { justify-content: flex-start; }
    .layout-a #page-photo { transform: rotate(-2.2deg); }

    .layout-b #page-photo-wrap { justify-content: flex-end; }
    .layout-b #page-photo { transform: rotate(1.8deg); }

    .layout-c #page-photo-wrap { justify-content: center; }
    .layout-c #page-photo { width: 320px; transform: rotate(-0.8deg); }

    #page-title {
      font-family: var(--el-font); font-style: italic; font-weight: 500;
      font-size: 27px; line-height: 1.35;
      color: var(--text-pri); margin-bottom: 6px;
      max-width: 90%;
    }
    #page-title-sub {
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 34px;
    }

    #page-lyrics { display: flex; flex-direction: column; }
    .lyric-en, .lyric-zh {
      display: block; opacity: 0; transform: translateY(4px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .lyric-en.visible, .lyric-zh.visible { opacity: 1; transform: translateY(0); }
    .lyric-en {
      font-family: var(--en-font); font-size: 15.5px; font-weight: 400;
      color: var(--text-pri); line-height: 1.7; margin-top: 2px;
    }
    .lyric-zh {
      font-family: var(--zh-font); font-size: 12.5px; font-weight: 300;
      color: var(--text-dim); line-height: 1.6; margin-bottom: 4px;
    }
    .lyric-blank { display: block; height: 22px; }

    #page-share {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 30px; padding: 8px 16px;
      background: none; border: 1px solid var(--border2); border-radius: 20px;
      color: var(--text-sec); font-family: var(--en-font); font-size: 12px;
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    #page-share:hover { border-color: var(--accent); color: var(--accent); }

    #page-footer {
      margin-top: 40px; padding-top: 18px; border-top: 1px dotted var(--border);
      font-size: 10.5px; color: var(--text-dim); font-family: var(--en-font);
    }

    #share-toast {
      position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--text-pri); color: var(--bg);
      padding: 8px 18px; border-radius: 20px; font-size: 12px;
      opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
      z-index: 60;
    }
    #share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Player bar (bound at the bottom like a spine/ribbon) ── */
    #player-bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 92px;
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; flex-direction: column; justify-content: center;
      padding: 10px 28px 16px; gap: 8px;
      z-index: 2;
    }
    #progress-wrap { display: flex; align-items: center; gap: 10px; }
    .time-label { font-family: var(--en-font); font-size: 10.5px; color: var(--text-dim); width: 32px; }
    #progress-track {
      flex: 1; height: 3px; background: var(--border); border-radius: 3px;
      position: relative; cursor: pointer;
    }
    #progress-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--accent); border-radius: 3px; }
    #progress-thumb {
      position: absolute; top: 50%; left: 0%; width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); transform: translate(-50%,-50%);
      box-shadow: 0 0 0 3px var(--surface);
    }
    #controls { display: flex; align-items: center; gap: 18px; }
    #volume-wrap { display: flex; align-items: center; gap: 6px; }
    #volume-icon { font-size: 13px; color: var(--text-dim); }
    #volume-slider { width: 70px; accent-color: var(--accent); }
    .ctrl-btn {
      background: none; border: none; color: var(--text-sec);
      font-size: 15px; cursor: pointer; padding: 6px;
      transition: color 0.15s;
    }
    .ctrl-btn:hover { color: var(--accent); }
    #btn-play {
      font-size: 15px; color: var(--bg);
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
    }
    #btn-play:hover { background: var(--accent2); }
    #mode-wrap { display: flex; gap: 4px; margin-left: auto; }
    .mode-btn {
      background: none; border: none; color: var(--text-dim);
      font-size: 14px; cursor: pointer; padding: 5px 7px; border-radius: 6px;
    }
    .mode-btn.active { color: var(--accent); background: var(--panel); }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      #toc-tab { top: auto; bottom: 106px; }
      #toc-panel { width: 88vw; }
      .page { padding: 88px 24px 48px; }
      #page-photo { max-width: 76%; }
      .layout-c #page-photo { width: 76%; }
      #page-title { font-size: 23px; }
      #player-bar { padding: 8px 16px 14px; height: 84px; }
      #volume-wrap { display: none; }
    }

    @media (min-width: 721px) and (max-width: 1080px) {
      #toc-backdrop { backdrop-filter: blur(1px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .page, .lyric-en, .lyric-zh, #page-photo, #toc-panel, #toc-overlay { transition: none !important; }
    }

    /* Keyboard focus visibility */
    button:focus-visible, .toc-item:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- 目錄 bookmark tab -->
  <button id="toc-tab" aria-label="打開目錄">
    <span id="toc-tab-icon">🔖</span><span>目錄</span>
  </button>

  <!-- TOC drawer -->
  <div id="toc-overlay">
    <div id="toc-backdrop"></div>
    <div id="toc-panel">
      <div id="toc-panel-header">
        <div>
          <div id="toc-panel-title">目錄</div>
          <div id="toc-count" class="panel-sub">載入中…</div>
        </div>
        <button id="toc-close" aria-label="關閉目錄">✕</button>
      </div>
      <div id="toc-list"></div>
      <div id="toc-theme-bar">
        <div class="theme-dot active" data-t="parchment" title="Parchment"></div>
        <div class="theme-dot" data-t="deepsea" title="Deep Sea"></div>
        <div class="theme-dot" data-t="dusk" title="Dusk"></div>
        <div class="theme-dot" data-t="mist" title="Mist"></div>
        <div class="theme-dot" data-t="midnight" title="Midnight"></div>
      </div>
    </div>
  </div>

  <!-- The book -->
  <main id="book">
    <div class="grain"></div>
    <div id="page-wrap">

      <!-- Cover / welcome page -->
      <section id="cover-page" class="page">
        <svg id="cover-wave" viewBox="0 0 320 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 30 C20 10,40 50,60 30 C80 10,100 50,120 30 C140 10,160 50,180 30 C200 10,220 50,240 30 C260 10,280 50,300 30 C310 20,315 25,320 30"
            stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" fill="none">
            <animate attributeName="d"
              values="M0 30 C20 10,40 50,60 30 C80 10,100 50,120 30 C140 10,160 50,180 30 C200 10,220 50,240 30 C260 10,280 50,300 30 C310 20,315 25,320 30;M0 30 C20 50,40 10,60 30 C80 50,100 10,120 30 C140 50,160 10,180 30 C200 50,220 10,240 30 C260 50,280 10,300 30 C310 40,315 35,320 30;M0 30 C20 10,40 50,60 30 C80 10,100 50,120 30 C140 10,160 50,180 30 C200 10,220 50,240 30 C260 10,280 50,300 30 C310 20,315 25,320 30"
              dur="4s" repeatCount="indefinite" />
          </path>
        </svg>
        <div id="cover-title">Ἐν τῇ ψυχῇ μου ἔχεις</div>
        <div id="cover-count" class="panel-sub">載入中…</div>
        <button id="cover-open-btn">打開目錄，選一首歌</button>
      </section>

      <!-- Song page -->
      <section id="song-page" class="page">
        <div id="page-tint"></div>
        <div id="page-number"></div>
        <div id="page-photo-wrap"><img id="page-photo" alt="" /></div>
        <h2 id="page-title">—</h2>
        <div id="page-title-sub"></div>
        <div id="page-lyrics"></div>
        <button id="page-share">⬡ 分享這首歌</button>
        <div id="page-footer">Music generated with Suno · Cover art generated with Gemini / ChatGPT</div>
      </section>

    </div>

    <span id="share-toast">已複製連結！</span>

    <!-- Player bar -->
    <div id="player-bar">
      <div id="progress-wrap">
        <span class="time-label" id="time-current">0:00</span>
        <div id="progress-track">
          <div id="progress-fill"></div>
          <div id="progress-thumb"></div>
        </div>
        <span class="time-label" id="time-total" style="text-align:right">0:00</span>
      </div>
      <div id="controls">
        <div id="volume-wrap">
          <span id="volume-icon">♪</span>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" />
        </div>
        <button class="ctrl-btn" id="btn-prev" title="上一首">&#9664;&#9664;</button>
        <button class="ctrl-btn" id="btn-play" title="播放/暫停">&#9654;</button>
        <button class="ctrl-btn" id="btn-next" title="下一首">&#9654;&#9654;</button>
        <div id="mode-wrap">
          <button class="mode-btn" id="btn-shuffle" title="隨機播放">⇄</button>
          <button class="mode-btn active" id="btn-loop-all" title="全部循環">↻</button>
          <button class="mode-btn" id="btn-loop-one" title="單曲循環">⟳</button>
        </div>
      </div>
    </div>
  </main>
</div>

<audio id="audio-player" preload="none"></audio>

<script>
  const audio = document.getElementById('audio-player');
  let songs = [], currentIndex = -1, isPlaying = false, playMode = 'all';

  // ── Theme ──
  const themes = ['parchment','deepsea','dusk','mist','midnight'];
  let currentTheme = localStorage.getItem('mb-theme') || 'parchment';

  function applyTheme(t) {
    currentTheme = t;
    document.documentElement.setAttribute('data-theme', t === 'parchment' ? '' : t);
    localStorage.setItem('mb-theme', t);
    document.querySelectorAll('.theme-dot').forEach(d => {
      d.classList.toggle('active', d.dataset.t === t);
    });
  }
  document.querySelectorAll('.theme-dot').forEach(d => {
    d.addEventListener('click', () => applyTheme(d.dataset.t));
  });
  applyTheme(currentTheme);

  // ── TOC drawer ──
  const tocOverlay = document.getElementById('toc-overlay');
  function openToc() { tocOverlay.classList.add('open'); }
  function closeToc() { tocOverlay.classList.remove('open'); }
  document.getElementById('toc-tab').addEventListener('click', openToc);
  document.getElementById('toc-close').addEventListener('click', closeToc);
  document.getElementById('toc-backdrop').addEventListener('click', closeToc);
  document.getElementById('cover-open-btn').addEventListener('click', openToc);

  // ── Init ──
  async function init() {
    try {
      const res = await fetch('songs.json');
      songs = await res.json();
      renderToc();
      const countText = songs.length + ' 首歌';
      document.getElementById('toc-count').textContent = countText;
      document.getElementById('cover-count').textContent = countText;

      const params = new URLSearchParams(window.location.search);
      const trackParam = params.get('track');
      if (trackParam) {
        const idx = songs.findIndex(s => s.id === trackParam.padStart(2,'0'));
        if (idx >= 0) { selectTrack(idx, { autoplay: false }); return; }
      }
      const lastTrack = localStorage.getItem('mb-last-track');
      if (lastTrack) {
        const idx = songs.findIndex(s => s.id === lastTrack);
        if (idx >= 0) selectTrack(idx, { autoplay: false });
      }
    } catch {
      document.getElementById('toc-count').textContent = '無法載入曲目';
      document.getElementById('cover-count').textContent = '無法載入曲目';
    }
  }

  function renderToc() {
    const list = document.getElementById('toc-list');
    list.innerHTML = '';
    songs.forEach((song, i) => {
      const item = document.createElement('div');
      item.className = 'toc-item';
      item.tabIndex = 0;
      item.dataset.index = i;
      item.innerHTML = `
        <span class="toc-num">${song.id}</span>
        <span class="toc-name">${escHtml(song.title)}</span>
        <span class="toc-dot"></span>
      `;
      item.addEventListener('click', () => { selectTrack(i); closeToc(); });
      item.addEventListener('keydown', e => {
        if (e.key === 'Enter') { selectTrack(i); closeToc(); }
      });
      list.appendChild(item);
    });
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Dominant color extraction for the per-page tint wash ──
  function applyPageTint(img) {
    const tint = document.getElementById('page-tint');
    try {
      const w = 20, h = 20;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const data = ctx.getImageData(0, 0, w, h).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < data.length; i += 4) {
        r += data[i]; g += data[i+1]; b += data[i+2]; n++;
      }
      r = Math.round(r/n); g = Math.round(g/n); b = Math.round(b/n);
      tint.style.background = `radial-gradient(ellipse at 30% 20%, rgba(${r},${g},${b},0.13), transparent 65%)`;
      tint.style.opacity = '1';
    } catch (e) {
      // canvas read blocked (e.g. file:// protocol) — fail silently, page just has no tint
      tint.style.opacity = '0';
    }
  }

  const LAYOUTS = ['layout-a', 'layout-b', 'layout-c'];

  async function selectTrack(index, opts = {}) {
    const autoplay = opts.autoplay !== false;
    currentIndex = index;
    const song = songs[index];

    document.getElementById('cover-page').style.display = 'none';
    const songPage = document.getElementById('song-page');

    const doUpdate = () => {
      songPage.className = 'page ' + LAYOUTS[index % LAYOUTS.length];
      songPage.style.display = 'block';

      document.getElementById('page-number').textContent = '— ' + song.id + ' / ' + String(songs.length).padStart(2,'0') + ' —';
      document.getElementById('page-title').textContent = song.title;

      const img = document.getElementById('page-photo');
      img.classList.remove('loaded');
      img.onload = () => { img.classList.add('loaded'); applyPageTint(img); };
      img.onerror = () => { img.style.display = 'none'; };
      img.style.display = '';
      img.src = 'images/' + song.id + '.png';

      document.getElementById('page-lyrics').innerHTML =
        '<span style="color:var(--text-dim);font-family:var(--zh-font);font-size:13px">載入中…</span>';
      loadLyrics(song.id);

      document.querySelectorAll('.toc-item').forEach((el, i) => el.classList.toggle('active', i === index));
      document.getElementById('page-wrap').scrollTop = 0;

      requestAnimationFrame(() => songPage.classList.remove('fading'));
    };

    if (songPage.style.display === 'block') {
      songPage.classList.add('fading');
      setTimeout(doUpdate, 190);
    } else {
      doUpdate();
    }

    localStorage.setItem('mb-last-track', song.id);
    const url = new URL(window.location.href);
    url.searchParams.set('track', song.id);
    window.history.replaceState({}, '', url);

    audio.src = 'audio/' + song.id + '.mp3';
    audio.load();
    if (autoplay) audio.play().catch(() => {});
  }

  async function loadLyrics(id) {
    const container = document.getElementById('page-lyrics');
    try {
      const res = await fetch('lyrics/' + id + '.txt');
      if (!res.ok) throw new Error();
      renderLyrics(await res.text(), container);
    } catch {
      container.innerHTML = '<span style="color:var(--text-dim);font-family:var(--zh-font);font-size:13px">歌詞未載入</span>';
    }
  }

  function renderLyrics(text, container) {
    const isEn = s => /^[\x00-\x7F\u00C0-\u024F\u0370-\u03FF\u1F00-\u1FFF\u2018\u2019\u201C\u201D\u2014\u2013\s]+$/.test(s.trim());
    const lines = text.split('\n');
    let start = 0;
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      if (i === 0 && !lines[i].match(/[,.'!?，。！？]/)) start = i + 1;
      break;
    }
    container.innerHTML = '';
    lines.slice(start).forEach(line => {
      const el = document.createElement('span');
      if (!line.trim()) {
        el.className = 'lyric-blank';
      } else if (isEn(line)) {
        el.className = 'lyric-en';
        el.textContent = line;
      } else {
        el.className = 'lyric-zh';
        el.textContent = line;
      }
      container.appendChild(el);
    });
    container.querySelectorAll('.lyric-en,.lyric-zh,.lyric-blank').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), i * 26);
    });
  }

  // ── Share ──
  document.getElementById('page-share').addEventListener('click', () => {
    if (currentIndex < 0) return;
    const url = window.location.href;
    navigator.clipboard.writeText(url).then(() => {
      const toast = document.getElementById('share-toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });
  });

  // ── Playback ──
  function togglePlay() {
    if (!songs.length || currentIndex < 0) return;
    if (isPlaying) audio.pause(); else audio.play();
  }
  function updatePlayBtn() {
    document.getElementById('btn-play').innerHTML = isPlaying ? '&#9646;&#9646;' : '&#9654;';
  }
  function markPlaying() {
    document.querySelectorAll('.toc-item').forEach((el, i) =>
      el.classList.toggle('playing', i === currentIndex && isPlaying));
  }
  function nextTrack() {
    if (!songs.length) return;
    let idx;
    if (playMode === 'shuffle') {
      do { idx = Math.floor(Math.random() * songs.length); }
      while (songs.length > 1 && idx === currentIndex);
    } else {
      idx = (currentIndex + 1) % songs.length;
    }
    selectTrack(idx);
  }
  function prevTrack() {
    if (!songs.length) return;
    selectTrack((currentIndex - 1 + songs.length) % songs.length);
  }
  function setMode(mode) {
    playMode = mode;
    audio.loop = mode === 'one';
    document.getElementById('btn-shuffle').classList.toggle('active', mode === 'shuffle');
    document.getElementById('btn-loop-all').classList.toggle('active', mode === 'all');
    document.getElementById('btn-loop-one').classList.toggle('active', mode === 'one');
  }
  document.getElementById('btn-shuffle').addEventListener('click', () =>
    setMode(playMode === 'shuffle' ? 'all' : 'shuffle'));
  document.getElementById('btn-loop-all').addEventListener('click', () =>
    setMode(playMode === 'all' ? 'shuffle' : 'all'));
  document.getElementById('btn-loop-one').addEventListener('click', () =>
    setMode(playMode === 'one' ? 'all' : 'one'));

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-thumb').style.left = pct + '%';
    document.getElementById('time-current').textContent = formatTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('time-total').textContent = formatTime(audio.duration);
  });
  audio.addEventListener('ended', () => { if (playMode !== 'one') nextTrack(); });
  audio.addEventListener('pause', () => { isPlaying = false; updatePlayBtn(); markPlaying(); });
  audio.addEventListener('play',  () => { isPlaying = true;  updatePlayBtn(); markPlaying(); });

  document.getElementById('progress-track').addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });

  const vol = document.getElementById('volume-slider');
  audio.volume = parseFloat(vol.value);
  vol.addEventListener('input', () => { audio.volume = parseFloat(vol.value); });

  document.getElementById('btn-play').addEventListener('click', togglePlay);
  document.getElementById('btn-prev').addEventListener('click', prevTrack);
  document.getElementById('btn-next').addEventListener('click', nextTrack);

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') nextTrack();
    if (e.code === 'ArrowLeft') prevTrack();
    if (e.code === 'Escape') closeToc();
  });

  function formatTime(sec) {
    if (isNaN(sec)) return '0:00';
    return Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
  }

  init();
</script>
</body>
</html>
