<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Box</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0e0e10;
      --surface:   #17171b;
      --panel:     #1e1e24;
      --border:    #2a2a33;
      --accent:    #c8a97e;
      --accent2:   #7ea8c8;
      --text-pri:  #e8e4dc;
      --text-sec:  #8a8680;
      --text-dim:  #4a4845;
      --en-font:   'DM Sans', sans-serif;
      --zh-font:   'Noto Sans TC', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-pri);
      font-family: var(--en-font);
      overflow: hidden;
    }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: 100vh;
      height: 100vh;
    }

    /* ── Sidebar ── */
    #sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #sidebar-header h1 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }

    #sidebar-header p {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      font-family: var(--zh-font);
    }

    #track-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    #track-list::-webkit-scrollbar { width: 3px; }
    #track-list::-webkit-scrollbar-track { background: transparent; }
    #track-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      cursor: pointer;
      transition: background 0.15s;
      border-left: 2px solid transparent;
    }

    .track-item:hover { background: var(--panel); }

    .track-item.active {
      background: var(--panel);
      border-left-color: var(--accent);
    }

    .track-num {
      font-size: 11px;
      color: var(--text-dim);
      width: 20px;
      flex-shrink: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .track-item.active .track-num { color: var(--accent); }

    .track-thumb {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--border);
    }

    .track-name {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-sec);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s;
    }

    .track-item:hover .track-name,
    .track-item.active .track-name { color: var(--text-pri); }

    .playing-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      margin-left: auto;
      animation: pulse 1.4s ease-in-out infinite;
      display: none;
    }

    .track-item.playing .playing-dot { display: block; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── Main Panel ── */
    #main {
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
      background: var(--bg);
    }

    /* ── Content area (cover + lyrics) ── */
    #content {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 0;
      overflow: hidden;
    }

    /* ── Cover side ── */
    #cover-side {
      padding: 40px 32px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }

    #cover-side::-webkit-scrollbar { display: none; }

    #cover-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel);
      position: relative;
    }

    #cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.4s ease;
    }

    #cover-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 32px;
    }

    #track-info { padding: 0 2px; }

    #track-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-pri);
      line-height: 1.4;
      margin-bottom: 6px;
    }

    #track-index {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    /* ── Lyrics side ── */
    #lyrics-side {
      padding: 40px 40px 32px;
      overflow-y: auto;
    }

    #lyrics-side::-webkit-scrollbar { width: 3px; }
    #lyrics-side::-webkit-scrollbar-track { background: transparent; }
    #lyrics-side::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    #lyrics-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 24px;
    }

    #lyrics-content {
      font-size: 14px;
      line-height: 2;
      color: var(--text-sec);
    }

    #lyrics-content .lyric-en {
      color: var(--text-pri);
      font-weight: 400;
      font-size: 14px;
      font-family: var(--en-font);
    }

    #lyrics-content .lyric-zh {
      color: var(--text-sec);
      font-weight: 300;
      font-size: 13px;
      font-family: var(--zh-font);
      margin-bottom: 2px;
    }

    #lyrics-content .lyric-blank {
      display: block;
      height: 16px;
    }

    #lyrics-empty {
      color: var(--text-dim);
      font-size: 13px;
      font-family: var(--zh-font);
    }

    /* ── Player bar ── */
    #player-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Progress */
    #progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-label {
      font-size: 11px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      width: 36px;
      flex-shrink: 0;
    }

    #progress-track {
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    #progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s linear;
      pointer-events: none;
    }

    #progress-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      left: 0%;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }

    #progress-track:hover #progress-thumb { opacity: 1; }

    /* Controls */
    #controls {
      display: flex;
      align-items: center;
      gap: 0;
      justify-content: center;
      position: relative;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-sec);
      cursor: pointer;
      padding: 8px 16px;
      font-size: 18px;
      transition: color 0.15s, transform 0.1s;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover { color: var(--text-pri); }
    .ctrl-btn:active { transform: scale(0.92); }

    #btn-play {
      font-size: 22px;
      color: var(--accent);
      padding: 8px 20px;
    }

    #btn-play:hover { color: var(--text-pri); }

    /* Volume */
    #volume-wrap {
      position: absolute;
      right: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #volume-icon {
      font-size: 14px;
      color: var(--text-dim);
    }

    #volume-slider {
      -webkit-appearance: none;
      width: 80px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-sec);
      cursor: pointer;
      transition: background 0.15s;
    }

    #volume-slider:hover::-webkit-slider-thumb { background: var(--accent); }

    audio { display: none; }

    /* ── Empty state ── */
    #empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-dim);
    }

    #empty-state .icon { font-size: 40px; }
    #empty-state p { font-size: 13px; font-family: var(--zh-font); }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      #app { grid-template-columns: 260px 1fr; }
      #content { grid-template-columns: 260px 1fr; }
      #cover-side { padding: 28px 20px 24px; }
    }

    @media (max-width: 680px) {
      html, body { overflow: auto; }
      #app { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; min-height: 100vh; }
      #sidebar { height: 50vh; }
      #main { grid-template-rows: 1fr auto; min-height: 60vh; }
      #content { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      #cover-side { border-right: none; border-bottom: 1px solid var(--border); padding: 24px 20px; }
      #cover-wrap { max-width: 200px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>Music Box</h1>
      <p id="track-count">載入中…</p>
    </div>
    <div id="track-list"></div>
  </aside>

  <!-- Main -->
  <main id="main">
    <div id="content">
      <!-- empty state before any selection -->
      <div id="empty-state">
        <div class="icon">♪</div>
        <p>從左側選擇一首歌開始</p>
      </div>

      <!-- cover side (hidden until selected) -->
      <div id="cover-side" style="display:none">
        <div id="cover-wrap">
          <div id="cover-placeholder">♪</div>
          <img id="cover-img" src="" alt="" style="opacity:0" />
        </div>
        <div id="track-info">
          <div id="track-title">—</div>
          <div id="track-index"></div>
        </div>
      </div>

      <!-- lyrics side (hidden until selected) -->
      <div id="lyrics-side" style="display:none">
        <div id="lyrics-label">Lyrics</div>
        <div id="lyrics-content"></div>
      </div>
    </div>

    <!-- Player bar -->
    <div id="player-bar">
      <div id="progress-wrap">
        <span class="time-label" id="time-current">0:00</span>
        <div id="progress-track">
          <div id="progress-fill"></div>
          <div id="progress-thumb"></div>
        </div>
        <span class="time-label" id="time-total" style="text-align:right">0:00</span>
      </div>
      <div id="controls">
        <button class="ctrl-btn" id="btn-prev" title="上一首">&#9664;&#9664;</button>
        <button class="ctrl-btn" id="btn-play" title="播放/暫停">&#9654;</button>
        <button class="ctrl-btn" id="btn-next" title="下一首">&#9654;&#9654;</button>
        <div id="volume-wrap">
          <span id="volume-icon">♪</span>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" />
        </div>
      </div>
    </div>
  </main>

</div>

<audio id="audio-player" preload="none"></audio>

<script>
  const audio = document.getElementById('audio-player');
  let songs = [];
  let currentIndex = -1;
  let isPlaying = false;

  // ── Load songs.json ──
  async function init() {
    try {
      const res = await fetch('songs.json');
      songs = await res.json();
      renderList();
      document.getElementById('track-count').textContent = `${songs.length} tracks`;
    } catch (e) {
      document.getElementById('track-count').textContent = '無法載入曲目';
    }
  }

  // ── Render sidebar list ──
  function renderList() {
    const list = document.getElementById('track-list');
    list.innerHTML = '';
    songs.forEach((song, i) => {
      const item = document.createElement('div');
      item.className = 'track-item';
      item.dataset.index = i;
      item.innerHTML = `
        <span class="track-num">${song.id}</span>
        <img class="track-thumb" src="images/${song.id}.png" alt="" loading="lazy"
             onerror="this.style.opacity='0'" />
        <span class="track-name">${song.title}</span>
        <span class="playing-dot"></span>
      `;
      item.addEventListener('click', () => selectTrack(i));
      list.appendChild(item);
    });
  }

  // ── Select & load track ──
  async function selectTrack(index) {
    currentIndex = index;
    const song = songs[index];

    // Update sidebar highlight
    document.querySelectorAll('.track-item').forEach((el, i) => {
      el.classList.toggle('active', i === index);
      el.classList.remove('playing');
    });

    // Show panels
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('cover-side').style.display = 'flex';
    document.getElementById('lyrics-side').style.display = 'block';

    // Cover
    const img = document.getElementById('cover-img');
    img.style.opacity = '0';
    img.src = `images/${song.id}.png`;
    img.onload = () => { img.style.opacity = '1'; };
    img.onerror = () => { img.style.opacity = '0'; };

    // Track info
    document.getElementById('track-title').textContent = song.title;
    document.getElementById('track-index').textContent = `Track ${song.id} / ${String(songs.length).padStart(2,'0')}`;

    // Audio
    audio.src = `audio/${song.id}.mp3`;
    audio.load();
    playAudio();

    // Lyrics
    document.getElementById('lyrics-content').innerHTML = '<span style="color:var(--text-dim);font-family:var(--zh-font);font-size:13px">載入中…</span>';
    loadLyrics(song.id);

    // Scroll sidebar item into view
    const activeItem = document.querySelector('.track-item.active');
    if (activeItem) activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // ── Load lyrics from .txt ──
  async function loadLyrics(id) {
    const container = document.getElementById('lyrics-content');
    try {
      const res = await fetch(`lyrics/${id}.txt`);
      if (!res.ok) throw new Error();
      const text = await res.text();
      renderLyrics(text, container);
    } catch {
      container.innerHTML = '<span id="lyrics-empty">歌詞未載入</span>';
    }
  }

  function renderLyrics(text, container) {
    const lines = text.split('\n');
    let html = '';
    // Skip title line (first non-empty line that matches song title)
    let startIndex = 0;
    // Find where lyrics actually begin (skip leading title/blank)
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].trim() === '') continue;
      // If first non-empty line looks like a title (no punctuation typical of lyrics), skip it
      const l = lines[i].trim();
      if (i === 0 && !l.match(/[,.'!?，。！？]/)) { startIndex = i + 1; break; }
      break;
    }

    const isEnglish = (s) => /^[\x00-\x7F\u00C0-\u024F]+$/.test(s.trim());

    for (let i = startIndex; i < lines.length; i++) {
      const line = lines[i];
      if (line.trim() === '') {
        html += '<span class="lyric-blank"></span>';
      } else if (isEnglish(line)) {
        html += `<div class="lyric-en">${escHtml(line)}</div>`;
      } else {
        html += `<div class="lyric-zh">${escHtml(line)}</div>`;
      }
    }
    container.innerHTML = html || '<span id="lyrics-empty">—</span>';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Playback ──
  function playAudio() {
    audio.play().then(() => {
      isPlaying = true;
      updatePlayBtn();
      markPlaying();
    }).catch(() => {});
  }

  function togglePlay() {
    if (!songs.length || currentIndex < 0) return;
    if (isPlaying) {
      audio.pause();
      isPlaying = false;
    } else {
      audio.play();
      isPlaying = true;
    }
    updatePlayBtn();
    markPlaying();
  }

  function updatePlayBtn() {
    document.getElementById('btn-play').innerHTML = isPlaying ? '&#9646;&#9646;' : '&#9654;';
  }

  function markPlaying() {
    document.querySelectorAll('.track-item').forEach((el, i) => {
      el.classList.toggle('playing', i === currentIndex && isPlaying);
    });
  }

  function prevTrack() {
    if (!songs.length) return;
    const idx = (currentIndex - 1 + songs.length) % songs.length;
    selectTrack(idx);
  }

  function nextTrack() {
    if (!songs.length) return;
    const idx = (currentIndex + 1) % songs.length;
    selectTrack(idx);
  }

  // ── Progress bar ──
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-thumb').style.left = pct + '%';
    document.getElementById('time-current').textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('time-total').textContent = formatTime(audio.duration);
  });

  audio.addEventListener('ended', () => { nextTrack(); });

  audio.addEventListener('pause', () => { isPlaying = false; updatePlayBtn(); markPlaying(); });
  audio.addEventListener('play',  () => { isPlaying = true;  updatePlayBtn(); markPlaying(); });

  document.getElementById('progress-track').addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  // ── Volume ──
  const volSlider = document.getElementById('volume-slider');
  audio.volume = parseFloat(volSlider.value);
  volSlider.addEventListener('input', () => { audio.volume = parseFloat(volSlider.value); });

  // ── Controls ──
  document.getElementById('btn-play').addEventListener('click', togglePlay);
  document.getElementById('btn-prev').addEventListener('click', prevTrack);
  document.getElementById('btn-next').addEventListener('click', nextTrack);

  // ── Keyboard shortcuts ──
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') nextTrack();
    if (e.code === 'ArrowLeft') prevTrack();
  });

  // ── Helpers ──
  function formatTime(sec) {
    if (isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  init();
</script>
</body>
</html>
